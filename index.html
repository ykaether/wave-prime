      const p110 = project3D(x1, y1, z0);
      const p010 = project3D(x0, y1, z0);

      const p001 = project3D(x0, y0, z1);
      const p101 = project3D(x1, y0, z1);
      const p111 = project3D(x1, y1, z1);
      const p011 = project3D(x0, y1, z1);

      const playerOnThisPlatform =
        player.x >= platform.x - 0.35 &&
        player.x <= platform.x + platform.w + 0.35 &&
        player.y >= platform.y - 0.35 &&
        player.y <= platform.y + platform.d + 0.35 &&
        Math.abs(player.z - (platform.z + platform.h)) <= 0.9;

      if (!p001 || !p101 || !p111 || !p011) {
        if (!playerOnThisPlatform) return;

        // Fallback: when standing on the platform, keep a visible surface
        // even if project3D cannot draw the real close-up platform corners.
        ctx.save();

        const cx = WIDTH / 2;
        const cy = HEIGHT * 0.76;
        const w = WIDTH * 0.50;
        const h = HEIGHT * 0.18;

        ctx.shadowColor = "rgba(190, 250, 255, 0.95)";
        ctx.shadowBlur = 18;
        ctx.fillStyle = "rgba(200, 250, 255, 0.30)";
        ctx.strokeStyle = "rgba(240, 255, 255, 0.95)";
        ctx.lineWidth = 2;

        ctx.beginPath();
        ctx.moveTo(cx - w * 0.50, cy + h * 0.45);
        ctx.lineTo(cx + w * 0.50, cy + h * 0.45);
        ctx.lineTo(cx + w * 0.34, cy - h * 0.35);
        ctx.lineTo(cx - w * 0.34, cy - h * 0.35);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        ctx.restore();
        return;
      }

      ctx.save();

      // glow
      ctx.shadowColor = "rgba(160, 245, 255, 0.95)";
      ctx.shadowBlur = 18;

      // top face
      ctx.beginPath();
      ctx.moveTo(p001.x, p001.y);
      ctx.lineTo(p101.x, p101.y);
      ctx.lineTo(p111.x, p111.y);
      ctx.lineTo(p011.x, p011.y);
      ctx.closePath();
      ctx.fillStyle = "rgba(180, 245, 255, 0.42)";
      ctx.fill();

      ctx.strokeStyle = "rgba(220, 255, 255, 0.95)";
      ctx.lineWidth = 2;
      ctx.stroke();

      // side faces, if visible
      ctx.shadowBlur = 8;

      if (p000 && p100 && p101 && p001) {
        ctx.beginPath();
        ctx.moveTo(p000.x, p000.y);
        ctx.lineTo(p100.x, p100.y);
        ctx.lineTo(p101.x, p101.y);
        ctx.lineTo(p001.x, p001.y);
        ctx.closePath();
        ctx.fillStyle = "rgba(80, 210, 255, 0.22)";
        ctx.fill();
      }

      if (p100 && p110 && p111 && p101) {
        ctx.beginPath();
        ctx.moveTo(p100.x, p100.y);
        ctx.lineTo(p110.x, p110.y);
        ctx.lineTo(p111.x, p111.y);
        ctx.lineTo(p101.x, p101.y);
        ctx.closePath();
        ctx.fillStyle = "rgba(80, 210, 255, 0.18)";
        ctx.fill();
      }

      // label


      ctx.restore();
    }

    function drawCurrentXrayPlatformFootprint() {
      if (visorMode !== "xray") return;

      const platform = getCurrentXrayPlatformUnderPlayer();
      if (!platform) return;

      const topZ = platform.z + platform.h;

      const p0 = project3D(platform.x, platform.y, topZ);
      const p1 = project3D(platform.x + platform.w, platform.y, topZ);
      const p2 = project3D(platform.x + platform.w, platform.y + platform.d, topZ);
      const p3 = project3D(platform.x, platform.y + platform.d, topZ);

      ctx.save();

      ctx.shadowColor = "rgba(190, 250, 255, 0.95)";
      ctx.shadowBlur = 18;
      ctx.fillStyle = "rgba(200, 250, 255, 0.32)";
      ctx.strokeStyle = "rgba(240, 255, 255, 0.95)";
      ctx.lineWidth = 2;

      // 通常の3D投影ができる場合は、Platformの上面をもう一度強調表示
      if (p0 && p1 && p2 && p3) {
        ctx.beginPath();
        ctx.moveTo(p0.x, p0.y);
        ctx.lineTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.lineTo(p3.x, p3.y);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      } else {
        // 近すぎて3D投影が崩れる場合の足元フォールバック表示
        const cx = WIDTH / 2;
        const cy = HEIGHT * 0.74;
        const w = WIDTH * 0.42;
        const h = HEIGHT * 0.15;

        ctx.beginPath();
        ctx.moveTo(cx - w * 0.50, cy + h * 0.45);
        ctx.lineTo(cx + w * 0.50, cy + h * 0.45);
        ctx.lineTo(cx + w * 0.34, cy - h * 0.35);
        ctx.lineTo(cx - w * 0.34, cy - h * 0.35);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      }

      ctx.restore();
    }

    function drawWorld() {
      pillarAVisible = false;
      pillarARenderState = null;
      depthBuffer.fill(MAX_DEPTH);

      if (ACTIVE_WORLD === 'World2') {
        for (const obj of PHYSICAL_OBJECTS) {
          if (obj.hidden) continue;
          const cx = obj.x + obj.w / 2;
          const cy = obj.y + obj.d / 2;
          let ang = Math.atan2(cy - player.y, cx - player.x) - player.angle;
          while (ang > Math.PI) ang -= Math.PI * 2;
          while (ang < -Math.PI) ang += Math.PI * 2;
          if (Math.abs(ang) > HALF_FOV + 0.18) continue;
          const dist = Math.hypot(cx - player.x, cy - player.y);
          const correctedDist = dist * Math.cos(ang);
          const screenRatio = (ang + HALF_FOV) / FOV;
          const rayIndex = clamp(Math.floor(screenRatio * (RAYS - 1)), 0, RAYS - 1);
          depthBuffer[rayIndex] = correctedDist;

          if (obj.id === 'pillar_a' && obj.segmentCount) {
            pillarAVisible = true;
            const segmentHeight = obj.h / obj.segmentCount;
            for (let seg = 0; seg < obj.segmentCount; seg++) {
              drawBox3D(
                obj.x,
                obj.y,
                obj.w,
                obj.d,
                segmentHeight,
                {
                  top: seg % 2 === 0 ? '#2ff7ff' : '#fff26b',
                  side: seg % 2 === 0 ? '#119aa0' : '#b5a92c',
                  front: seg % 2 === 0 ? '#22d9e1' : '#eedb42',
                  outline: '#0c1014',
                },
                1,
                false,
                obj.z + seg * segmentHeight
              );
            }
            const base = project3D(obj.x + obj.w / 2, obj.y + obj.d / 2, obj.z);
            const top = project3D(obj.x + obj.w / 2, obj.y + obj.d / 2, obj.z + obj.h);
            if (base && top) {
              pillarARenderState = {
                left: base.x - 26 / base.z * 6,
                right: base.x + 26 / base.z * 6,
                top: top.y,
                bottom: base.y,
                depth: base.z,
              };
            }
          } else {
            drawBox3D(obj.x, obj.y, obj.w, obj.d, obj.h, obj.colors, 1, false, obj.z);
            if (obj.type === 'platform') drawPlatformGlow(obj);
          }
        }
        return;
      }

      const horizon = getSceneHorizon();
      for (let i = 0; i < RAYS; i++) {
        const ratio = i / RAYS;
        const rayAngle = player.angle - HALF_FOV + ratio * FOV;
        const hit = castWallRayFrom(player.x, player.y, rayAngle);
        const corrected = hit.depth * Math.cos(rayAngle - player.angle);
        depthBuffer[i] = corrected;
        const wallH = Math.min(HEIGHT, (HEIGHT * 0.82) / Math.max(0.0001, corrected));
        const x = ratio * WIDTH;
        const w = WIDTH / RAYS + 1;
        const shade = clamp(1 - corrected / MAX_DEPTH, 0.12, 1);
        const wallTop = horizon - wallH / 2;
        const wallBottom = wallTop + wallH;
        ctx.fillStyle = `rgb(${Math.floor(120 * shade + 58)}, ${Math.floor(146 * shade + 54)}, ${Math.floor(92 * shade + 26)})`;
        ctx.fillRect(x, wallTop, w, wallH);

        ctx.fillStyle = `rgb(${Math.floor(94 * shade + 54)}, ${Math.floor(112 * shade + 58)}, ${Math.floor(64 * shade + 34)})`;
        ctx.fillRect(x, wallBottom, w, HEIGHT - wallBottom);
      }

      for (const zone of HEIGHT_ZONES) {
        if (zone.hgt <= 0.05) continue;
        const cx = zone.x + zone.w / 2;
        const cy = zone.y + zone.h / 2;
        let ang = Math.atan2(cy - player.y, cx - player.x) - player.angle;
        while (ang > Math.PI) ang -= Math.PI * 2;
        while (ang < -Math.PI) ang += Math.PI * 2;
        if (Math.abs(ang) > HALF_FOV + 0.18) continue;
        const dist = Math.hypot(cx - player.x, cy - player.y);
        const correctedDist = dist * Math.cos(ang);
        const screenRatio = (ang + HALF_FOV) / FOV;
        const rayIndex = clamp(Math.floor(screenRatio * (RAYS - 1)), 0, RAYS - 1);
        if (depthBuffer[rayIndex] < correctedDist - 0.1) continue;
        drawBox3D(zone.x, zone.y, zone.w, zone.h, zone.hgt, {
          top: zone.tint,
          side: zone.side || '#4d5f3d',
          front: zone.front || '#61764b',
          outline: '#28331e'
        });
      }

      for (const obj of PHYSICAL_OBJECTS) {
        if (obj.hidden) continue;
        const cx = obj.x + obj.w / 2;
        const cy = obj.y + obj.d / 2;
        let ang = Math.atan2(cy - player.y, cx - player.x) - player.angle;
        while (ang > Math.PI) ang -= Math.PI * 2;
        while (ang < -Math.PI) ang += Math.PI * 2;
        if (Math.abs(ang) > HALF_FOV + 0.18) continue;
        const dist = Math.hypot(cx - player.x, cy - player.y);
        const correctedDist = dist * Math.cos(ang);
        const screenRatio = (ang + HALF_FOV) / FOV;
        const rayIndex = clamp(Math.floor(screenRatio * (RAYS - 1)), 0, RAYS - 1);
        if (depthBuffer[rayIndex] < correctedDist - 0.1) continue;
        if (obj.id === 'pillar_a' && obj.segmentCount) {
          pillarAVisible = true;
          const segmentHeight = obj.h / obj.segmentCount;
          for (let seg = 0; seg < obj.segmentCount; seg++) {
            drawBox3D(
              obj.x,
              obj.y,
              obj.w,
              obj.d,
              segmentHeight,
              {
                top: seg % 2 === 0 ? '#2ff7ff' : '#fff26b',
                side: seg % 2 === 0 ? '#119aa0' : '#b5a92c',
                front: seg % 2 === 0 ? '#22d9e1' : '#eedb42',
                outline: '#0c1014',
              },
              1,
              false,
              obj.z + seg * segmentHeight
            );
          }
          const base = project3D(obj.x + obj.w / 2, obj.y + obj.d / 2, obj.z);
          const top = project3D(obj.x + obj.w / 2, obj.y + obj.d / 2, obj.z + obj.h);
          if (base && top) {
            pillarARenderState = {
              left: base.x - 26 / base.z * 6,
              right: base.x + 26 / base.z * 6,
              top: top.y,
              bottom: base.y,
              depth: base.z,
            };
          }
        } else {
          drawBox3D(obj.x, obj.y, obj.w, obj.d, obj.h, obj.colors, 1, false, obj.z);
        }
      }
    }

    function drawEnemyXraySkeleton(e) {
      if (visorMode !== "xray") return;
      if (e.dead) return;

      const cx = e.x + e.w / 2;
      const cy = e.y + e.d / 2;
      const z = e.z || 0;

      const dx = player.x - cx;
      const dy = player.y - cy;

      let fx = 0;
      let fy = 0;

      if (Math.abs(dx) >= Math.abs(dy)) {
        fx = dx >= 0 ? 1 : -1;
      } else {
        fy = dy >= 0 ? 1 : -1;
      }

      const sx = -fy;
      const sy = fx;

      function p(forward, side, up) {
        return project3D(
          cx + fx * forward + sx * side,
          cy + fy * forward + sy * side,
          z + up
        );
      }

      const head = p(e.w * 0.35, 0, e.h * 0.75);
      const chest = p(e.w * 0.12, 0, e.h * 0.58);
      const belly = p(0, 0, e.h * 0.42);
      const pelvis = p(-e.w * 0.18, 0, e.h * 0.28);

      const leftClawBase = p(e.w * 0.25, -e.w * 0.28, e.h * 0.40);
      const rightClawBase = p(e.w * 0.25, e.w * 0.28, e.h * 0.40);
      const leftClawTip = p(e.w * 0.42, -e.w * 0.42, e.h * 0.22);
      const rightClawTip = p(e.w * 0.42, e.w * 0.42, e.h * 0.22);

      const leftLeg1 = p(0, -e.w * 0.35, e.h * 0.20);
      const rightLeg1 = p(0, e.w * 0.35, e.h * 0.20);
      const leftFoot1 = p(e.w * 0.05, -e.w * 0.42, e.h * 0.04);
      const rightFoot1 = p(e.w * 0.05, e.w * 0.42, e.h * 0.04);

      const leftLeg2 = p(-e.w * 0.22, -e.w * 0.28, e.h * 0.18);
      const rightLeg2 = p(-e.w * 0.22, e.w * 0.28, e.h * 0.18);
      const leftFoot2 = p(-e.w * 0.12, -e.w * 0.35, e.h * 0.04);
      const rightFoot2 = p(-e.w * 0.12, e.w * 0.35, e.h * 0.04);

      const tail = p(-e.w * 0.45, 0, e.h * 0.22);

      if (
        !head || !chest || !belly || !pelvis ||
        !leftClawBase || !rightClawBase || !leftClawTip || !rightClawTip ||
        !leftLeg1 || !rightLeg1 || !leftFoot1 || !rightFoot1 ||
        !leftLeg2 || !rightLeg2 || !leftFoot2 || !rightFoot2 ||
        !tail
      ) return;

      const bodyH = Math.max(20, Math.abs(pelvis.y - head.y));
      const skullR = Math.max(5, bodyH * 0.08);
      const ribW = Math.max(10, bodyH * 0.18);

      ctx.save();

      ctx.strokeStyle = "rgba(255,255,255,0.95)";
      ctx.fillStyle = "rgba(255,255,255,0.18)";
      ctx.lineWidth = 2;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.shadowColor = "rgba(255,255,255,0.9)";
      ctx.shadowBlur = 8;

      // skull
      ctx.beginPath();
      ctx.arc(head.x, head.y, skullR, 0, Math.PI * 2);
      ctx.stroke();

      // spine
      ctx.beginPath();
      ctx.moveTo(head.x, head.y);
      ctx.lineTo(chest.x, chest.y);
      ctx.lineTo(belly.x, belly.y);
      ctx.lineTo(pelvis.x, pelvis.y);
      ctx.stroke();

      // ribs
      for (let i = 0; i < 4; i++) {
        const t = i / 3;
        const y = chest.y + bodyH * (0.04 + t * 0.16);
        const w = ribW * (1 - t * 0.12);

        ctx.beginPath();
        ctx.moveTo(chest.x - w, y);
        ctx.quadraticCurveTo(chest.x, y + 5, chest.x + w, y);
        ctx.stroke();
      }

      // front claws
      ctx.beginPath();
      ctx.moveTo(chest.x, chest.y);
      ctx.lineTo(leftClawBase.x, leftClawBase.y);
      ctx.lineTo(leftClawTip.x, leftClawTip.y);

      ctx.moveTo(chest.x, chest.y);
      ctx.lineTo(rightClawBase.x, rightClawBase.y);
      ctx.lineTo(rightClawTip.x, rightClawTip.y);
      ctx.stroke();

      // legs
      ctx.beginPath();
      ctx.moveTo(pelvis.x, pelvis.y);
      ctx.lineTo(leftLeg1.x, leftLeg1.y);
      ctx.lineTo(leftFoot1.x, leftFoot1.y);

      ctx.moveTo(pelvis.x, pelvis.y);
      ctx.lineTo(rightLeg1.x, rightLeg1.y);
      ctx.lineTo(rightFoot1.x, rightFoot1.y);

      ctx.moveTo(pelvis.x, pelvis.y);
      ctx.lineTo(leftLeg2.x, leftLeg2.y);
      ctx.lineTo(leftFoot2.x, leftFoot2.y);

      ctx.moveTo(pelvis.x, pelvis.y);
      ctx.lineTo(rightLeg2.x, rightLeg2.y);
      ctx.lineTo(rightFoot2.x, rightFoot2.y);
      ctx.stroke();

      // tail
      ctx.beginPath();
      ctx.moveTo(pelvis.x, pelvis.y);
      ctx.lineTo(tail.x, tail.y);
      ctx.stroke();

      ctx.restore();
    }
    

    function drawEnemyCreature(e, flash, isLocked, meleeFx = false, bossPhase = 'idle') {
      const z = e.z || 0;
      const cx = e.x + e.w / 2;
      const cy = e.y + e.d / 2;

      // プレイヤーの方向をスムーズに向く
      const dx = player.x - cx;
      const dy = player.y - cy;
      const dist = Math.hypot(dx, dy) || 1;

      const fx = dx / dist;
      const fy = dy / dist;

      // 向きに対する左右方向
      const sx = -fy;
      const sy = fx;

      function drawPart(forward, side, w, d, h, colors, partZ, locked = false) {
        const x = cx + fx * forward + sx * side - w / 2;
        const y = cy + fy * forward + sy * side - d / 2;
        drawBox3D(x, y, w, d, h, colors, 1, locked, partZ);
      }

      const chargingUp = bossPhase === 'pre_charge';
      const charging   = bossPhase === 'charging';
      const preJump    = bossPhase === 'pre_jump';
      const airborne   = bossPhase === 'jumping';
      const burstMode  = bossPhase === 'pre_burst' || bossPhase === 'bursting';
      const waveMode   = bossPhase === 'pre_wave'  || bossPhase === 'wave_recover';

      const bodyColors = {
        top:  (charging||chargingUp) ? '#ff2200' : (preJump||airborne) ? '#44ffdd' : burstMode ? '#ffaa00' : waveMode ? '#4488ff' : meleeFx ? '#ffdd44' : flash ? '#ff9999' : '#5c1c2a',
        side: (charging||chargingUp) ? '#aa0e00' : (preJump||airborne) ? '#00aaaa' : burstMode ? '#cc7700' : waveMode ? '#2255cc' : meleeFx ? '#cc9900' : flash ? '#cc5555' : '#3e1018',
        front:(charging||chargingUp) ? '#ff4400' : (preJump||airborne) ? '#66ffee' : burstMode ? '#ffcc44' : waveMode ? '#66aaff' : meleeFx ? '#ffee66' : flash ? '#ff7777' : '#6e2232',
        outline: '#1a0810',
      };

      const fleshColors = {
        top:  (charging||chargingUp) ? '#ff5533' : (preJump||airborne) ? '#88ffee' : burstMode ? '#ffcc55' : waveMode ? '#88bbff' : meleeFx ? '#ffe877' : flash ? '#ffbbbb' : '#7a2d3d',
        side: (charging||chargingUp) ? '#cc2200' : (preJump||airborne) ? '#22cccc' : burstMode ? '#dd9900' : waveMode ? '#3366cc' : meleeFx ? '#ddaa22' : flash ? '#cc7777' : '#4a1824',
        front:(charging||chargingUp) ? '#ff6644' : (preJump||airborne) ? '#aaffee' : burstMode ? '#ffdd66' : waveMode ? '#99ccff' : meleeFx ? '#ffee88' : flash ? '#ff9999' : '#8a3546',
        outline: '#1a0810',
      };

      const limbColors = {
        top: flash ? '#ffc0a0' : '#6b4032',
        side: flash ? '#d08a72' : '#47291f',
        front: flash ? '#ffb08f' : '#8b5642',
        outline: '#1a0810',
      };

      const eyeColors = {
        top: '#ffffff',
        side: '#cccccc',
        front: '#ffffff',
        outline: '#1a0810',
      };

      // 胴体
      drawPart(0, 0, e.w * 0.75, e.d * 0.75, e.h * 0.35, bodyColors, z + e.h * 0.22, isLocked);

      // 胸
      drawPart(e.w * 0.10, 0, e.w * 0.55, e.d * 0.55, e.h * 0.20, fleshColors, z + e.h * 0.48);

      // 頭：プレイヤー側に出す
      drawPart(e.w * 0.35, 0, e.w * 0.35, e.d * 0.32, e.h * 0.20, fleshColors, z + e.h * 0.60);

      // 目：頭の前側に2つ
      drawPart(e.w * 0.48, -e.w * 0.10, e.w * 0.07, e.d * 0.07, e.h * 0.05, eyeColors, z + e.h * 0.72);
      drawPart(e.w * 0.48,  e.w * 0.10, e.w * 0.07, e.d * 0.07, e.h * 0.05, eyeColors, z + e.h * 0.72);

      // 前脚・爪
      drawPart(e.w * 0.35, -e.w * 0.32, e.w * 0.12, e.d * 0.35, e.h * 0.10, limbColors, z + e.h * 0.34);
      drawPart(e.w * 0.35,  e.w * 0.32, e.w * 0.12, e.d * 0.35, e.h * 0.10, limbColors, z + e.h * 0.34);

      // 横脚
      drawPart(0, -e.w * 0.38, e.w * 0.10, e.d * 0.28, e.h * 0.10, limbColors, z + e.h * 0.22);
      drawPart(0,  e.w * 0.38, e.w * 0.10, e.d * 0.28, e.h * 0.10, limbColors, z + e.h * 0.22);

      drawPart(-e.w * 0.22, -e.w * 0.30, e.w * 0.10, e.d * 0.25, e.h * 0.09, limbColors, z + e.h * 0.18);
      drawPart(-e.w * 0.22,  e.w * 0.30, e.w * 0.10, e.d * 0.25, e.h * 0.09, limbColors, z + e.h * 0.18);

      // 尻尾
      drawPart(-e.w * 0.42, 0, e.w * 0.18, e.d * 0.18, e.h * 0.12, limbColors, z + e.h * 0.28);
    }
    function drawEnemies() {
      if (ACTIVE_WORLD !== 'World2') return;
      for (const e of enemies) {
        if (e.dead) continue;

        // Teleport telegraph: flicker with increasing speed as phaseTimer drops
        if (e.bossPhase === 'pre_tp') {
          const flickerInterval = Math.max(1, Math.floor(e.phaseTimer / 7));
          if (Math.floor(e.phaseTimer / flickerInterval) % 2 === 0) continue;
        }

        const cx = e.x + e.w / 2, cy = e.y + e.d / 2;
        let ang = Math.atan2(cy - player.y, cx - player.x) - player.angle;
        while (ang > Math.PI) ang -= Math.PI * 2;
        while (ang < -Math.PI) ang += Math.PI * 2;
        if (Math.abs(ang) > HALF_FOV + 0.18) continue;
        const dist = Math.hypot(cx - player.x, cy - player.y);
        if (dist < 0.3) continue;
        const correctedDist = dist * Math.cos(ang);
        const screenRatio = (ang + HALF_FOV) / FOV;
        const rayIndex = clamp(Math.floor(screenRatio * (RAYS - 1)), 0, RAYS - 1);
        if (depthBuffer[rayIndex] < correctedDist - 0.1) continue;

        const flash = e.invTimer > 0 && Math.floor(e.invTimer / 4) % 2 === 1;
        const meleeFx = e.meleeFx > 0;
        const isLocked = player.lockTarget === e;
        const isDying = e.state === 'dying';
        const isTeleportBlink = e.state === 'teleport_tell' && Math.floor(e.stateTimer / 2) % 2 === 1;
        if (isDying) {
          const blinkPhase = 1 - (e.deathTimer / ENEMY_DEATH_TIME);
          const blinkStep = Math.floor(blinkPhase * ENEMY_DEATH_BLINKS * 2);
          if (blinkStep % 2 === 1) continue;
        }
        if (isTeleportBlink) continue;
        if (visorMode === "xray") {
          drawEnemyXraySkeleton(e);
        } else {
          drawEnemyGirlSprite(e, flash, isLocked, meleeFx, isDying ? e.deathAlpha : 1, isDying);
        }
      }
    }

    function drawEnemyGirlSprite(e, flash, isLocked, meleeFx, spriteAlpha = 1, isDying = false) {
      const cx = e.x + e.w / 2;
      const cy = e.y + e.d / 2;
      const base = project3D(cx, cy, e.z);
      const top = project3D(cx, cy, e.z + e.h);
      if (!base || !top) return;

      const spriteH = Math.max(72, (base.y - top.y) * 2.15);
      const spriteW = spriteH * 0.56;
      const drawX = base.x - spriteW / 2;
      const drawY = base.y - spriteH * 0.94;

      ctx.save();
      ctx.globalAlpha = spriteAlpha;

      // Grounding shadow so the sprite feels planted on the same world floor.
      ctx.fillStyle = 'rgba(8, 14, 18, 0.34)';
      ctx.beginPath();
      ctx.ellipse(base.x, base.y + 3, spriteW * 0.2, spriteH * 0.045, 0, 0, Math.PI * 2);
      ctx.fill();

      if (enemyGirlImg.complete && enemyGirlImg.naturalWidth > 0) {
        ctx.drawImage(enemyGirlImg, drawX, drawY, spriteW, spriteH);
      } else {
        ctx.fillStyle = '#8ea2d8';
        ctx.fillRect(drawX, drawY, spriteW, spriteH);
      }

      drawEnemyPixelWaveOverlay(e, drawX, drawY, spriteW, spriteH);

      if (e.overheadCharge > 0 || e.state === 'overhead_fire') {
        const headOrb = project3D(cx, cy, e.z + e.h + 0.42 + e.overheadCharge * 0.18);
        if (headOrb) {
          const charge = Math.max(e.overheadCharge, e.state === 'overhead_fire' ? 1 : 0);
          const orbR = ENEMY_OVERHEAD_ORB_BASE_SIZE + (ENEMY_OVERHEAD_ORB_MAX_SIZE - ENEMY_OVERHEAD_ORB_BASE_SIZE) * charge;
          const pulse = 0.82 + Math.sin(performance.now() * 0.01) * 0.18;
          ctx.save();
          ctx.shadowColor = 'rgba(150,240,255,0.95)';
          ctx.shadowBlur = 28 + orbR * 0.4;
          ctx.fillStyle = `rgba(120,110,255,${0.16 + charge * 0.18})`;
          ctx.beginPath();
          ctx.arc(headOrb.x, headOrb.y, orbR * 1.65 * pulse, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = `rgba(120,255,245,${0.34 + charge * 0.28})`;
          ctx.beginPath();
          ctx.arc(headOrb.x, headOrb.y, orbR * 0.98, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = 'rgba(255,255,255,0.96)';
          ctx.beginPath();
          ctx.arc(headOrb.x, headOrb.y, orbR * 0.34, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }

      if (isDying) {
        ctx.fillStyle = `rgba(120,255,240,${0.12 + (1 - spriteAlpha) * 0.22})`;
        ctx.beginPath();
        ctx.ellipse(base.x, base.y - spriteH * 0.3, spriteW * 0.42, spriteH * 0.52, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      if (flash) {
        ctx.fillStyle = 'rgba(255,255,255,0.42)';
        ctx.fillRect(drawX, drawY, spriteW, spriteH);
      }

      if (meleeFx) {
        ctx.strokeStyle = 'rgba(255,120,120,0.88)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(base.x, base.y - spriteH * 0.38, spriteW * 0.48, -0.8, 0.8);
        ctx.stroke();
      }

      if (isLocked) {
        ctx.strokeStyle = 'rgba(255,220,120,0.96)';
        ctx.lineWidth = 2;
        ctx.strokeRect(drawX + spriteW * 0.18, drawY + spriteH * 0.08, spriteW * 0.64, spriteH * 0.76);
      }

      ctx.restore();
    }

    function drawEnemyPixelWaveOverlay(e, drawX, drawY, spriteW, spriteH) {
      const distToPlayer = Math.hypot((e.x + e.w / 2) - player.x, (e.y + e.d / 2) - player.y);
      if (distToPlayer > ENEMY_PIXEL_WAVE_MAX_DIST) return;
      const block = distToPlayer > 8 ? ENEMY_PIXEL_WAVE_BLOCK + 2 : ENEMY_PIXEL_WAVE_BLOCK;
      const t = performance.now() * ENEMY_PIXEL_WAVE_SPEED;
      const centerX = drawX + spriteW * 0.5;
      const centerY = drawY + spriteH * 0.6;
      const boost = e.state === 'charge' ? 1.22 : 1;

      ctx.save();
      ctx.beginPath();
      ctx.rect(drawX, drawY, spriteW, spriteH);
      ctx.clip();

      for (let py = drawY + spriteH * 0.22; py < drawY + spriteH * 0.92; py += block) {
        for (let px = drawX + spriteW * 0.18; px < drawX + spriteW * 0.82; px += block) {
          const nx = (px - centerX) / spriteW;
          const ny = (py - centerY) / spriteH;
          const dist = Math.hypot(nx * 1.1, ny * 1.55);
          const wave = Math.sin(dist * 26 - t);
          const stepped = Math.floor(((wave + 1) * 0.5) * 5) / 5;
          if (stepped < 0.4) continue;
          const alpha = ENEMY_PIXEL_WAVE_ALPHA * stepped * boost * (distToPlayer > 8 ? 0.72 : 1);
          const r = Math.floor(24 + stepped * 48);
          const g = Math.floor(130 + stepped * 90);
          const b = Math.floor(180 + stepped * 72);
          ctx.fillStyle = `rgba(${r},${g},${b},${alpha})`;
          ctx.fillRect(px, py, block, block);
        }
      }

      ctx.restore();
    }

    function drawEnemyFace(e) {
      const cx = e.x + e.w / 2, cy = e.y + e.d / 2;
      const fa = e.angle || 0;
      // Only draw when face side is within ~100° of camera
      const toCam = Math.atan2(player.y - cy, player.x - cx);
      let diff = fa - toCam;
      while (diff > Math.PI) diff -= Math.PI * 2;
      while (diff < -Math.PI) diff += Math.PI * 2;
      if (Math.abs(diff) > Math.PI * 0.65) return;

      const fsx = cx + Math.cos(fa) * 0.36;
      const fsy = cy + Math.sin(fa) * 0.36;
      const fp = project3D(fsx, fsy, e.z + e.h * 0.62);
      if (!fp) return;

      const sc = Math.max(1.5, 9 / fp.z);
      const eyeY = fp.y - sc * 0.3;

      // Eye glow halos
      ctx.fillStyle = 'rgba(255,80,0,0.32)';
      ctx.beginPath(); ctx.arc(fp.x - sc * 0.9, eyeY, sc * 1.2, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(fp.x + sc * 0.9, eyeY, sc * 1.2, 0, Math.PI * 2); ctx.fill();
      // Eyes
      ctx.fillStyle = '#ff5500';
      ctx.beginPath(); ctx.arc(fp.x - sc * 0.9, eyeY, sc * 0.48, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(fp.x + sc * 0.9, eyeY, sc * 0.48, 0, Math.PI * 2); ctx.fill();
      // Angry mouth
      ctx.strokeStyle = '#cc2200';
      ctx.lineWidth = Math.max(1, sc * 0.28);
      ctx.beginPath();
      ctx.moveTo(fp.x - sc * 0.8, fp.y + sc * 0.5);
      ctx.lineTo(fp.x, fp.y + sc * 0.85);
      ctx.lineTo(fp.x + sc * 0.8, fp.y + sc * 0.5);
      ctx.stroke();
    }

    function drawPlatformGlow(obj) {
      const eZ = obj.z + obj.h + 0.01;
      const p0 = project3D(obj.x,         obj.y,         eZ);
      const p1 = project3D(obj.x + obj.w, obj.y,         eZ);
      const p2 = project3D(obj.x + obj.w, obj.y + obj.d, eZ);
      const p3 = project3D(obj.x,         obj.y + obj.d, eZ);
      const pts = [p0, p1, p2, p3].filter(Boolean);
      if (pts.length < 3) return;
      // Soft outer glow
      ctx.strokeStyle = 'rgba(0,180,255,0.22)';
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
      ctx.closePath(); ctx.stroke();
      // Crisp inner edge
      ctx.strokeStyle = 'rgba(0,220,255,0.72)';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
      ctx.closePath(); ctx.stroke();
    }

    function drawEnemyShots() {
      for (const b of enemyBullets) {
        const p = project3D(b.x, b.y, b.z);
        if (!p) continue;
        const energyR = 34 / p.z;
        const sz = b.size || 1;
        const isWave = b.wave;
        const tint = b.tint || (isWave ? 'wave' : 'single');
        const shadowColor = tint === 'triple'
          ? "rgba(255, 190, 70, 0.98)"
          : tint === 'arc'
            ? "rgba(90, 255, 245, 0.98)"
          : isWave
            ? "rgba(80, 140, 255, 0.98)"
            : "rgba(255, 90, 60, 0.98)";
        const outerColor = tint === 'triple'
          ? "rgba(255, 165, 60, 0.82)"
          : tint === 'arc'
            ? "rgba(90, 210, 255, 0.82)"
          : isWave
            ? "rgba(60, 100, 255, 0.78)"
            : "rgba(255, 75, 40, 0.82)";
        const innerColor = tint === 'triple'
          ? "rgba(255, 225, 120, 0.98)"
          : tint === 'arc'
            ? "rgba(220, 255, 255, 0.98)"
          : isWave
            ? "rgba(120, 180, 255, 0.96)"
            : "rgba(255, 210, 120, 0.98)";

        ctx.save();
        ctx.shadowColor = shadowColor;
        ctx.shadowBlur = 14 * sz;

        ctx.fillStyle = outerColor;
        ctx.beginPath();
        ctx.arc(p.x, p.y, Math.max(10 * sz, energyR * 2.6 * sz), 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = innerColor;
        ctx.beginPath();
        ctx.arc(p.x, p.y, Math.max(6 * sz, energyR * 1.55 * sz), 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "rgba(255, 250, 220, 0.98)";
        ctx.beginPath();
        ctx.arc(p.x, p.y, Math.max(3 * sz, energyR * 0.66 * sz), 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }
    }

    function drawPlayerMissiles() {
      for (const m of playerMissiles) {
        const p = project3D(m.x, m.y, m.z);
        if (!p) continue;
        const missileR = Math.max(4, 24 / p.z);
        const tail = project3D(m.x - m.dirX * 0.9, m.y - m.dirY * 0.9, m.z);
        ctx.save();
        ctx.shadowColor = 'rgba(255,180,80,0.95)';
        ctx.shadowBlur = 12;
        if (tail) {
          ctx.strokeStyle = 'rgba(255,150,70,0.72)';
          ctx.lineWidth = Math.max(3, missileR * 0.75);
          ctx.beginPath();
          ctx.moveTo(tail.x, tail.y);
          ctx.lineTo(p.x, p.y);
          ctx.stroke();
        }
        ctx.fillStyle = 'rgba(255,180,70,0.88)';
        ctx.beginPath();
        ctx.arc(p.x, p.y, missileR * 1.55, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = 'rgba(255,245,180,0.98)';
        ctx.beginPath();
        ctx.arc(p.x, p.y, missileR * 0.72, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,120,60,0.9)';
        ctx.lineWidth = Math.max(2, missileR * 0.45);
        ctx.beginPath();
        ctx.moveTo(p.x - missileR * 1.8, p.y);
        ctx.lineTo(p.x + missileR * 1.4, p.y);
        ctx.stroke();
        ctx.restore();
      }

      for (const burst of missileBursts) {
        const p = project3D(burst.x, burst.y, burst.z);
        if (!p) continue;
        const life = burst.timer / 16;
        const burstR = Math.max(12, (72 / p.z) * (1 - life + 0.35));
        ctx.save();
        ctx.shadowColor = 'rgba(255,220,120,0.95)';
        ctx.shadowBlur = 14;
        ctx.fillStyle = `rgba(255,180,70,${0.22 * life})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, burstR * 2.1, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = `rgba(255,235,170,${0.95 * life})`;
        ctx.lineWidth = Math.max(3, burstR * 0.18);
        ctx.beginPath();
        ctx.arc(p.x, p.y, burstR, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }
    }

    function drawEnemyDiagonalLaserOverlay() {
      for (const e of enemies) {
        if (e.dead) continue;
        if (e.attackPattern !== 'diagonal_laser' || e.patternTimer <= 0) continue;

        const total = ENEMY_DIAGONAL_LASER_TELL_TIME + ENEMY_DIAGONAL_LASER_FIRE_TIME;
        const elapsed = total - e.patternTimer;
        const line = getDiagonalLaserScreenLine(e.attackPatternDirection || 1);
        const firing = elapsed >= ENEMY_DIAGONAL_LASER_TELL_TIME;

        ctx.save();
        ctx.lineCap = 'round';
        if (!firing) {
          const tellPulse = 0.45 + Math.sin(performance.now() * 0.01) * 0.22;
          ctx.strokeStyle = `rgba(150,220,255,${0.22 + tellPulse * 0.22})`;
          ctx.lineWidth = 3;
          ctx.setLineDash([14, 10]);
          ctx.beginPath();
          ctx.moveTo(line.x1, line.y1);
          ctx.lineTo(line.x2, line.y2);
          ctx.stroke();
        } else {
          const firePulse = 0.8 + Math.sin(performance.now() * 0.02) * 0.2;
          ctx.strokeStyle = `rgba(120,255,255,${0.26 + firePulse * 0.15})`;
          ctx.lineWidth = ENEMY_DIAGONAL_LASER_WIDTH * 2.2;
          ctx.shadowColor = 'rgba(80,240,255,0.95)';
          ctx.shadowBlur = 28;
          ctx.beginPath();
          ctx.moveTo(line.x1, line.y1);
          ctx.lineTo(line.x2, line.y2);
          ctx.stroke();

          ctx.strokeStyle = `rgba(170,255,255,${0.88})`;
          ctx.lineWidth = ENEMY_DIAGONAL_LASER_WIDTH;
          ctx.beginPath();
          ctx.moveTo(line.x1, line.y1);
          ctx.lineTo(line.x2, line.y2);
          ctx.stroke();

          ctx.strokeStyle = 'rgba(255,255,255,0.95)';
          ctx.lineWidth = Math.max(4, ENEMY_DIAGONAL_LASER_WIDTH * 0.32);
          ctx.beginPath();
          ctx.moveTo(line.x1, line.y1);
          ctx.lineTo(line.x2, line.y2);
          ctx.stroke();
        }
        ctx.restore();
      }
    }

    function drawWorldLabels() {
      if (!showDebugLabels) return;

      ctx.save();
      ctx.font = '12px monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      for (const obj of WORLD_OBJECTS) {
        if (obj.hidden) continue;
        let anchor = null;
        if (obj.id === 'pillar_a' && pillarARenderState) {
          anchor = {
            kind: 'slice',
            x: (pillarARenderState.left + pillarARenderState.right) / 2,
            y: pillarARenderState.top - 18,
            depth: pillarARenderState.depth,
          };
        } else {
          const pos = obj.getPosition?.();
          if (!pos) continue;

          let ang = Math.atan2(pos.y - player.y, pos.x - player.x) - player.angle;
          while (ang > Math.PI) ang -= Math.PI * 2;
          while (ang < -Math.PI) ang += Math.PI * 2;
          if (Math.abs(ang) > HALF_FOV + 0.32) continue;

          const dist = Math.hypot(pos.x - player.x, pos.y - player.y);
          const correctedDist = dist * Math.cos(ang);
          if (correctedDist <= 0.08) continue;

          const screenRatio = (ang + HALF_FOV) / FOV;
          const rayIndex = clamp(Math.floor(screenRatio * (RAYS - 1)), 0, RAYS - 1);
          if (depthBuffer[rayIndex] < correctedDist - 0.18 && obj.type !== 'player_start') continue;

          anchor = { kind: 'world', x: pos.x, y: pos.y, z: pos.z + (obj.labelOffsetZ || 0.3) };
        }

        const p = projectLabelAnchor(anchor);
        if (!p) continue;

        const text = obj.label;
        const padX = 6;
        const w = ctx.measureText(text).width + padX * 2;
        const h = 18;
        const x = p.x;
        const y = p.y - 8;

        ctx.fillStyle = 'rgba(10, 14, 18, 0.72)';
        ctx.fillRect(x - w / 2, y - h / 2, w, h);
        ctx.strokeStyle = 'rgba(220, 230, 210, 0.65)';
        ctx.lineWidth = 1;
        ctx.strokeRect(x - w / 2, y - h / 2, w, h);
        ctx.fillStyle = '#f3f6ea';
        ctx.fillText(text, x, y + 0.5);
      }

      ctx.restore();
    }

    function drawPillarASegmentLabels() {
      if (!showDebugLabels || !currentPillarA || currentPillarA.hidden || !pillarARenderState) return;

      ctx.save();
      ctx.font = '10px monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      for (let i = 0; i < PILLAR_A_SEGMENTS; i++) {
        const p = projectLabelAnchor({
          kind: 'slice',
          x: pillarARenderState.left - 16,
          y: pillarARenderState.bottom - ((i + 0.5) / PILLAR_A_SEGMENTS) * (pillarARenderState.bottom - pillarARenderState.top),
          depth: pillarARenderState.depth,
        });
        if (!p) continue;
        const tagX = p.x;
        const tagY = p.y;
        ctx.fillStyle = 'rgba(12, 16, 20, 0.62)';
        ctx.fillRect(tagX - 8, tagY - 6, 16, 12);
        ctx.fillStyle = '#fff5d4';
        ctx.fillText(`${i + 1}`, tagX, tagY + 0.5);
      }

      ctx.restore();
    }

    function drawHeightGuides() {
      if (!showHeightGuides) return;

      ctx.save();
      ctx.setLineDash([8, 6]);

      for (const guide of DEBUG_GUIDES) {
        if (guide.type === 'projection_line') {
          const obj = WORLD_OBJECTS.find(worldObj => worldObj.id === guide.objectId);
          if (!obj || obj.hidden) continue;
          const pos = obj.getPosition?.();
          if (!pos) continue;
          const top = project3D(pos.x, pos.y, pos.z + (obj.labelOffsetZ || 0.3) - 0.12);
          const base = project3D(pos.x, pos.y, getGroundHeightAt(pos.x, pos.y));
          if (!top || !base) continue;
          ctx.strokeStyle = 'rgba(235, 240, 220, 0.52)';
          ctx.lineWidth = 1.2;
          ctx.beginPath();
          ctx.moveTo(top.x, top.y);
          ctx.lineTo(base.x, base.y);
          ctx.stroke();
          continue;
        }

        if (guide.type === 'forward_line') {
          const obj = WORLD_OBJECTS.find(worldObj => worldObj.id === guide.objectId);
          if (!obj || obj.hidden) continue;
          const from = project3D(PLAYER_START.x, PLAYER_START.y, getGroundHeightAt(PLAYER_START.x, PLAYER_START.y) + 0.02);
          const pos = obj.getPosition?.();
          if (!pos || !from) continue;
          const to = project3D(pos.x, pos.y, getGroundHeightAt(pos.x, pos.y) + 0.02);
          if (!to) continue;
          ctx.strokeStyle = 'rgba(255, 214, 120, 0.72)';
          ctx.lineWidth = 1.4;
          ctx.beginPath();
          ctx.moveTo(from.x, from.y);
          ctx.lineTo(to.x, to.y);
          ctx.stroke();
          continue;
        }

        if (guide.type === 'height_level') {
          const points = [
            project3D(player.x + 1.6, player.y - 2.2, guide.z),
            project3D(player.x + 8.5, player.y - 2.2, guide.z),
            project3D(player.x + 8.5, player.y + 2.6, guide.z),
            project3D(player.x + 1.6, player.y + 2.6, guide.z),
          ];
          if (points.some(p => !p)) continue;
          ctx.strokeStyle = 'rgba(120, 210, 255, 0.34)';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(points[0].x, points[0].y);
          for (let i = 1; i < points.length; i++) ctx.lineTo(points[i].x, points[i].y);
          ctx.closePath();
          ctx.stroke();
          ctx.setLineDash([]);
          ctx.fillStyle = 'rgba(220, 240, 255, 0.78)';
          ctx.font = '11px monospace';
          ctx.fillText(guide.label, points[0].x + 50, points[0].y - 8);
          ctx.setLineDash([8, 6]);
        }
      }

      ctx.setLineDash([]);
      ctx.restore();
    }

    function drawShotHitMarker() {
      if (!shotHitMarker || shotHitMarker.timer <= 0) return;
      const p = projectLabelAnchor({ kind: 'world', x: shotHitMarker.x, y: shotHitMarker.y, z: shotHitMarker.z });
      if (!p) return;
      ctx.save();
      ctx.font = '11px monospace';
      ctx.textAlign = 'center';
      const w = ctx.measureText(shotHitMarker.text).width + 12;
      ctx.fillStyle = 'rgba(14, 20, 26, 0.78)';
      ctx.fillRect(p.x - w / 2, p.y - 22, w, 18);
      ctx.strokeStyle = 'rgba(255,255,255,0.85)';
      ctx.strokeRect(p.x - w / 2, p.y - 22, w, 18);
      ctx.fillStyle = '#f4fff2';
      // ctx.fillText(shotHitMarker.text, p.x, p.y - 9);
      ctx.restore();
    }

    function drawCoordinateGrid() {
      if (!showCoordinateGrid) return;

      ctx.save();
      ctx.font = '10px monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const playerBaseCell = objectToBaseCell({ x: player.x, y: player.y });
      const pillarBaseCell = currentPillarA && !currentPillarA.hidden ? objectToBaseCell(currentPillarA) : null;
      const targetInfo = raycastHitToCoordinate(currentAimHit);

      const px = Math.floor(player.x);
      const py = Math.floor(player.y);
      const minCellX = Math.max(0, px - COORD_GRID_RADIUS);
      const maxCellX = Math.min(MAP_W - 1, px + COORD_GRID_RADIUS);
      const minCellY = Math.max(0, py - COORD_GRID_RADIUS);
      const maxCellY = Math.min(MAP_H - 1, py + COORD_GRID_RADIUS);

      for (let cellY = minCellY; cellY <= maxCellY; cellY++) {
        for (let cellX = minCellX; cellX <= maxCellX; cellX++) {
          if (MAP[cellY][cellX] === '1') continue;

          const centerX = cellX + 0.5;
          const centerY = cellY + 0.5;
          const floorZ = getBaseGroundHeightAt(centerX, centerY) + 0.01;
          const corners = [
            project3D(cellX, cellY, floorZ),
            project3D(cellX + 1, cellY, floorZ),
            project3D(cellX + 1, cellY + 1, floorZ),
            project3D(cellX, cellY + 1, floorZ),
          ];
          if (corners.some(p => !p)) continue;

          const isPillarBase = pillarBaseCell && pillarBaseCell.cellX === cellX && pillarBaseCell.cellY === cellY;
          const isPlayerCell = playerBaseCell && playerBaseCell.cellX === cellX && playerBaseCell.cellY === cellY;
          const isTargetCell = targetInfo && targetInfo.cellX === cellX && targetInfo.cellY === cellY;
          const label = cellIndicesToLabel(cellX, cellY);
          const center = {
            x: (corners[0].x + corners[1].x + corners[2].x + corners[3].x) / 4,
            y: (corners[0].y + corners[1].y + corners[2].y + corners[3].y) / 4,
          };

          ctx.beginPath();
          ctx.moveTo(corners[0].x, corners[0].y);
          for (let i = 1; i < corners.length; i++) ctx.lineTo(corners[i].x, corners[i].y);
          ctx.closePath();
          ctx.fillStyle = isPillarBase
            ? 'rgba(255, 236, 140, 0.24)'
            : isPlayerCell
              ? 'rgba(120, 200, 255, 0.22)'
              : isTargetCell
                ? 'rgba(255, 140, 140, 0.18)'
                : ((cellX + cellY) % 2 === 0 ? 'rgba(60, 100, 160, 0.18)' : 'rgba(40, 76, 130, 0.10)');
          ctx.fill();
          ctx.strokeStyle = isPillarBase
            ? 'rgba(255, 242, 150, 0.92)'
            : isPlayerCell
              ? 'rgba(100, 220, 255, 0.95)'
              : isTargetCell
                ? 'rgba(255, 150, 150, 0.9)'
                : 'rgba(120, 170, 220, 0.16)';
          ctx.lineWidth = (isPillarBase || isPlayerCell || isTargetCell) ? 1.6 : 0.8;
          ctx.stroke();

          const shouldLabelCell =
            isPillarBase || isPlayerCell || isTargetCell || (((cellX + cellY) % 3) === 0);
          if (shouldLabelCell) {
            ctx.fillStyle = isPillarBase
              ? 'rgba(255, 251, 210, 0.98)'
              : isPlayerCell
                ? 'rgba(210, 255, 255, 0.95)'
                : isTargetCell
                  ? 'rgba(255, 220, 220, 0.92)'
                  : 'rgba(220, 238, 228, 0.62)';
            ctx.fillText(label, center.x, center.y);
          }

          if (isPillarBase) {
            ctx.fillStyle = 'rgba(255, 252, 220, 0.98)';
            ctx.fillText(`Pillar A: ${label}`, center.x, center.y - 14);
          }
          if (isPlayerCell) {
            ctx.fillStyle = 'rgba(220, 255, 255, 0.95)';
            ctx.fillText(`Player: ${label}`, center.x, center.y + 14);
          }
        }
      }

      ctx.restore();
    }

    function getCannonPose() {
      const recoil = player.shootCD > SHOOT_CD - 3 ? 24 : 0;
      const lift = -player.pitch * 72;
      return {
        backX: WIDTH * 0.73,
        backY: HEIGHT * 0.87 + lift * 0.35,
        frontX: WIDTH * 0.86 + recoil,
        frontY: HEIGHT * 0.79 + lift,
        muzzleX: WIDTH * 0.885 + recoil,
        muzzleY: HEIGHT * 0.786 + lift * 1.02,
      };
    }

    function drawSword() {
      const swinging = player.swordFx && player.swordFx.timer > 0;
      const life = swinging ? player.swordFx.timer / 12 : 0;
      const hx = WIDTH * 0.80, hy = HEIGHT * 0.86;
      const bladeLen = 240;
      const swingOffset = swinging ? Math.PI * 0.6 * (1 - life) : Math.PI * 0.6;

      ctx.save();
      ctx.translate(hx, hy);
      ctx.rotate(-Math.PI * 0.08 - swingOffset);

      if (swinging) { ctx.shadowColor = 'rgba(140,220,255,0.9)'; ctx.shadowBlur = 20; }

      // blade body
      ctx.beginPath();
      ctx.moveTo(-7, 24); ctx.lineTo(-4, -bladeLen); ctx.lineTo(0, -bladeLen - 30);
      ctx.lineTo(4, -bladeLen); ctx.lineTo(7, 24); ctx.closePath();
      ctx.fillStyle = swinging ? '#e4f6ff' : '#7aaec4';
      ctx.fill();
      ctx.strokeStyle = swinging ? 'rgba(160,240,255,0.85)' : 'rgba(100,170,210,0.5)';
      ctx.lineWidth = 1.5; ctx.stroke();

      // energy line down center
      ctx.strokeStyle = swinging ? 'rgba(200,255,255,0.9)' : 'rgba(140,210,240,0.4)';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(0, 10); ctx.lineTo(0, -bladeLen + 10); ctx.stroke();

      ctx.shadowBlur = 0;
      // guard
      ctx.fillStyle = '#2a3c4e';
      ctx.fillRect(-20, 14, 40, 16);
      ctx.fillStyle = '#3a5268';
      ctx.fillRect(-15, 17, 30, 10);
      // handle
      ctx.fillStyle = '#1a2530';
      ctx.fillRect(-7, 30, 14, 44);
      ctx.restore();

      // swing arc
      if (swinging) {
        ctx.save();
        ctx.lineCap = 'round';
        ctx.strokeStyle = `rgba(160,240,255,${life * 0.65})`;
        ctx.lineWidth = 28 * life;
        ctx.beginPath();
        ctx.arc(hx, hy, bladeLen * 0.82, -Math.PI * 0.76, -Math.PI * 0.10);
        ctx.stroke();
        ctx.strokeStyle = `rgba(240,255,255,${life * 0.4})`;
        ctx.lineWidth = 10 * life;
        ctx.beginPath();
        ctx.arc(hx, hy, bladeLen * 0.82, -Math.PI * 0.76, -Math.PI * 0.10);
        ctx.stroke();
        ctx.restore();
      }
    }

    function drawGun() {
      if (!armCannonImg.complete || armCannonImg.naturalWidth === 0) return;

      // まずは小さめに固定
      const cannonWidth = WIDTH * 0.37;
      const cannonHeight = cannonWidth * (armCannonImg.naturalHeight / armCannonImg.naturalWidth);

      // 右下に置く
      const x = WIDTH - cannonWidth - 150;
      const y = HEIGHT - cannonHeight + 10;

      ctx.save();
      ctx.globalAlpha = 0.95;

      // 反転・回転なしでまず安定表示
      ctx.drawImage(
        armCannonImg,
        x,
        y,
        cannonWidth,
        cannonHeight
      );

      ctx.restore();
    }

    function drawShotFx() {
      if (!player.shotFx || player.shotFx.timer <= 0) return;
      const maxTimer = player.shotFx.charged ? PLAYER_CHARGE_BEAM_TIME : PLAYER_SHOT_FX_TIME;
      const life   = player.shotFx.timer / maxTimer;
      const travel = 1 - life;
      const pose   = getCannonPose();
      const chargeScale = player.shotFx.chargeScale || 1;
      const motionTime = performance.now() * 0.0002375;
      const isWaveShot = player.shotFx.mode === 'wave';

      const muzzleX = pose.muzzleX + 70;
      const muzzleY = pose.muzzleY + 55;

      const hitPoint = project3D(player.shotFx.x, player.shotFx.y, player.shotFx.z);
      const targetX  = hitPoint ? hitPoint.x : WIDTH / 2;
      const targetY  = hitPoint ? hitPoint.y : HEIGHT / 2;

      const orbX = muzzleX + (targetX - muzzleX) * travel;
      const orbY = muzzleY + (targetY - muzzleY) * travel;
      const orbR = (18 - 8 * travel) * chargeScale;

      if (!isWaveShot) {
        ctx.save();
        ctx.lineCap = 'round';
        ctx.strokeStyle = `rgba(90,235,255,${0.45 * life})`;
        ctx.lineWidth = (player.shotFx.charged ? 10 : 6) * chargeScale;
        ctx.shadowColor = 'rgba(90,235,255,0.9)';
        ctx.shadowBlur = 12 * chargeScale;
        ctx.beginPath();
        ctx.moveTo(muzzleX, muzzleY);
        ctx.lineTo(orbX, orbY);
        ctx.stroke();

        ctx.strokeStyle = `rgba(220,255,255,${0.9 * life})`;
        ctx.lineWidth = (player.shotFx.charged ? 4.8 : 2.8) * chargeScale;
        ctx.beginPath();
        ctx.moveTo(muzzleX, muzzleY);
        ctx.lineTo(orbX, orbY);
        ctx.stroke();

        ctx.fillStyle = `rgba(90,255,220,${0.26 * life})`;
        ctx.beginPath();
        ctx.arc(orbX, orbY, orbR * 1.7, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = `rgba(120,255,240,${0.92 * life})`;
        ctx.beginPath();
        ctx.arc(orbX, orbY, orbR * (player.shotFx.charged ? 1.1 : 0.88), 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = `rgba(255,255,255,${0.96 * life})`;
        ctx.beginPath();
        ctx.arc(orbX, orbY, orbR * 0.34, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        return;
      }

      // 弾道に対して垂直な方向ベクトル（スクリーン空間）
      const pathDX = targetX - muzzleX;
      const pathDY = targetY - muzzleY;
      const pathLen = Math.hypot(pathDX, pathDY) || 1;
      const perpX = -pathDY / pathLen;
      const perpY =  pathDX / pathLen;

      const STEPS = WAVE_BEAM_STEPS;
      const FREQ  = 0.92;
      const helixRadius = (156 + (player.shotFx.charged ? 84 : 0)) * chargeScale;
      const widthBoost = player.shotFx.charged ? 2.35 : 1.7;
      const waveBands = [
        { phase: motionTime, color: [110, 90, 255], width: 8.2, alpha: 0.68 },
        { phase: motionTime + Math.PI, color: [90, 255, 235], width: 8.2, alpha: 0.68 },
        { phase: motionTime + Math.PI * 0.5, color: [210, 130, 255], width: 5.2, alpha: 0.48 },
      ];

      ctx.save();
      ctx.shadowColor = `rgba(150,120,255,0.72)`;
      ctx.shadowBlur = 12 * chargeScale;
      ctx.strokeStyle = `rgba(120,200,255,${0.22 * life})`;
      ctx.lineWidth = 10 * widthBoost * life;
      ctx.beginPath();
      ctx.moveTo(muzzleX, muzzleY);
      ctx.lineTo(orbX, orbY);
      ctx.stroke();
      ctx.restore();

      for (const band of waveBands) {
        const [cr, cg, cb] = band.color;
        ctx.save();
        ctx.shadowColor = `rgba(${cr},${cg},${cb},0.95)`;
        ctx.shadowBlur  = 18 * chargeScale;
        ctx.strokeStyle = `rgba(${cr},${cg},${cb},${band.alpha * life})`;
        ctx.lineWidth   = band.width * life * widthBoost;
        ctx.lineCap = 'round';
        ctx.beginPath();

        for (let s = 0; s <= STEPS; s++) {
          const relT = s / STEPS;
          const bx = muzzleX + pathDX * relT * travel;
          const by = muzzleY + pathDY * relT * travel;
          const arcScale = Math.sin(relT * Math.PI);
          const swing = Math.sin(relT * Math.PI * 2 * FREQ + band.phase);
          const amp = helixRadius * arcScale * (0.7 + relT * 0.55) * life;
          const px = bx + perpX * swing * amp;
          const py = by + perpY * swing * amp;
          if (s === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.stroke();
        ctx.restore();
      }

      // 弾頭のコアオーブ（既存のまま）
      ctx.save();
      ctx.fillStyle = `rgba(120,110,255,${0.24 * life})`;
      ctx.beginPath();
      ctx.arc(orbX, orbY, orbR * 2.4, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = `rgba(120,255,220,${0.9 * life})`;
      ctx.beginPath();
      ctx.arc(orbX, orbY, orbR * 1.16, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = `rgba(255,255,255,${0.98 * life})`;
      ctx.beginPath();
      ctx.arc(orbX, orbY, orbR * 0.45, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawReticle() {
      const hit = player.shootCD > SHOOT_CD - 2;
      ctx.strokeStyle = player.lockTarget ? '#ffd768' : (hit ? '#ffd7a0' : '#dfeadf');
      ctx.lineWidth = 2;
      const cx = WIDTH / 2;
      const cy = HEIGHT / 2;
      const gap = 12;
      const len = hit ? 16 : 12;
      ctx.beginPath();
      ctx.moveTo(cx - gap - len, cy); ctx.lineTo(cx - gap, cy);
      ctx.moveTo(cx + gap, cy); ctx.lineTo(cx + gap + len, cy);
      ctx.moveTo(cx, cy - gap - len); ctx.lineTo(cx, cy - gap);
      ctx.moveTo(cx, cy + gap); ctx.lineTo(cx, cy + gap + len);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(255,244,220,0.28)';
      ctx.beginPath();
      ctx.arc(cx, cy, player.lockTarget ? 34 : 26, 0, Math.PI * 2);
      ctx.stroke();
      if (player.lockTarget) {
        ctx.strokeStyle = 'rgba(255,220,120,0.9)';
        ctx.beginPath();
        ctx.arc(cx, cy, 42, Math.PI * 0.1, Math.PI * 0.4);
        ctx.arc(cx, cy, 42, Math.PI * 0.6, Math.PI * 0.9);
        ctx.arc(cx, cy, 42, Math.PI * 1.1, Math.PI * 1.4);
        ctx.arc(cx, cy, 42, Math.PI * 1.6, Math.PI * 1.9);
        ctx.stroke();
      }
      if (player.chargeLevel > 0.02) {
        const pulse = 0.7 + Math.sin(performance.now() * 0.012) * 0.3;
        const chargeR = 12 + player.chargeLevel * 26 * pulse;
        ctx.fillStyle = `rgba(60,220,255,${0.16 + player.chargeLevel * 0.2})`;
        ctx.beginPath();
        ctx.arc(cx, cy, chargeR * 1.3, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = `rgba(120,255,240,${0.5 + player.chargeLevel * 0.35})`;
        ctx.lineWidth = 2 + player.chargeLevel * 2;
        ctx.beginPath();
        ctx.arc(cx, cy, chargeR, 0, Math.PI * 2);
        ctx.stroke();
      }
    }

    function drawMinimap() {
      // Local view centred on player: show ±VIEW cells in each direction
      const VIEW_X = 22, VIEW_Y = 14;
      const scale = 4;
      const pcX = Math.floor(player.x), pcY = Math.floor(player.y);
      const x0 = Math.max(0, pcX - VIEW_X), x1 = Math.min(MAP_W - 1, pcX + VIEW_X);
      const y0 = Math.max(0, pcY - VIEW_Y), y1 = Math.min(MAP_H - 1, pcY + VIEW_Y);
      const mW = (x1 - x0 + 1) * scale, mH = (y1 - y0 + 1) * scale;
      const ox = 18, oy = HEIGHT - mH - 20;

      ctx.fillStyle = 'rgba(2,8,20,0.78)';
      ctx.fillRect(ox - 4, oy - 4, mW + 8, mH + 8);

      const playerCell = worldToCellIndices(player.x, player.y);
      const targetCell = currentAimHit && currentAimHit.depth < MAX_DEPTH
        ? worldToCellIndices(currentAimHit.x, currentAimHit.y) : null;

      for (let y = y0; y <= y1; y++) {
        for (let x = x0; x <= x1; x++) {
          const sx = ox + (x - x0) * scale, sy = oy + (y - y0) * scale;
          const isPlayer = (x === playerCell.cellX && y === playerCell.cellY);
          const isTarget = targetCell && x === targetCell.cellX && y === targetCell.cellY;
          ctx.fillStyle = isPlayer ? 'rgba(120,240,255,0.28)' : isTarget ? 'rgba(255,140,140,0.2)' : '#1c2830';
          ctx.fillRect(sx, sy, scale - 1, scale - 1);
        }
      }

      // objects on minimap
      for (const obj of GRID_OBJECTS) {
        if (obj.hidden) continue;
        if (obj.tileX < x0 || obj.tileX > x1 || obj.tileY < y0 || obj.tileY > y1) continue;
        const sx = ox + (obj.tileX - x0) * scale, sy = oy + (obj.tileY - y0) * scale;
        ctx.fillStyle = obj.id === 'pillar_a' ? '#e5d97a' : obj.type === 'platform' ? '#3a68aa' : '#7a8898';
        ctx.fillRect(sx, sy, Math.max(1, obj.w * scale - 1), Math.max(1, obj.d * scale - 1));
      }

      // player dot + direction
      const px = ox + (player.x - x0) * scale, py = oy + (player.y - y0) * scale;
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(px - 2, py - 2, 4, 4);
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(px, py);
      ctx.lineTo(px + Math.cos(player.angle) * scale * 0.9, py + Math.sin(player.angle) * scale * 0.9);
      ctx.stroke();

      // enemies
      for (const e of enemies) {
        if (e.dead || e.x < x0 || e.x > x1 + 1 || e.y < y0 || e.y > y1 + 1) continue;
        const isLocked = player.lockTarget === e;
        const ex = ox + (e.x + e.w / 2 - x0) * scale;
        const ey = oy + (e.y + e.d / 2 - y0) * scale;
        ctx.fillStyle = isLocked ? '#ffd740' : '#ff4455';
        ctx.fillRect(ex - 3, ey - 3, 6, 6);
        if (isLocked) { ctx.strokeStyle = '#ffd740'; ctx.lineWidth = 1; ctx.strokeRect(ex - 5, ey - 5, 10, 10); }
      }

      // goal orb
      if (!goalReached && goalOrb.x >= x0 && goalOrb.x <= x1 && goalOrb.y >= y0 && goalOrb.y <= y1) {
        const gox = ox + (goalOrb.x - x0) * scale;
        const goy = oy + (goalOrb.y - y0) * scale;
        const gt = Date.now() / 600;
        ctx.fillStyle = `rgba(220,255,100,${0.6 + 0.4 * Math.sin(gt)})`;
        ctx.beginPath(); ctx.arc(gox, goy, 5, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#ffffaa'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(gox, goy, 7, 0, Math.PI * 2); ctx.stroke();
      }

      // target / pillar highlight
      if (targetCell && targetCell.cellX >= x0 && targetCell.cellX <= x1 && targetCell.cellY >= y0 && targetCell.cellY <= y1) {
        const sx = ox + (targetCell.cellX - x0) * scale, sy = oy + (targetCell.cellY - y0) * scale;
        ctx.strokeStyle = 'rgba(0,255,255,0.9)'; ctx.lineWidth = 1.5;
        ctx.strokeRect(sx - 1, sy - 1, scale + 1, scale + 1);
      }
    }

    function drawGoalOrb() {
      if (goalReached) return;
      const t = Date.now() / 1000;
      const bobZ = goalOrb.orbZ + Math.sin(t * 2.2) * 0.2;
      const p = project3D(goalOrb.x, goalOrb.y, bobZ);
      if (!p) return;
      const sz = Math.max(3, 28 / p.z);
      const pulse = 0.6 + 0.4 * Math.sin(t * 2.8);
      ctx.fillStyle = `rgba(180,255,80,${0.10 * pulse})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, sz * 4.5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = `rgba(220,255,100,${0.30 * pulse})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, sz * 2.2, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,180,0.95)';
      ctx.beginPath(); ctx.arc(p.x, p.y, sz, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(p.x, p.y, sz * 0.42, 0, Math.PI * 2); ctx.fill();
    }

    function drawDamageFlash() {
      if (player.hitFlash <= 0) return;
      ctx.fillStyle = `rgba(255,40,90,${player.hitFlash / 40})`;
      ctx.fillRect(0, 0, WIDTH, HEIGHT);
    }

    // Hard-disable shot hit marker display.
    // This overrides the earlier drawShotHitMarker() definition.
    function drawShotHitMarker() {
      shotHitMarker = null;
    }

    function loop() {
      animationFrameId = null;
      if (cleanupDone || loopStopped) return;
      if (!gameStarted) {
        canvas.style.filter = "none";
        drawStartScreen();
        if (!cleanupDone && !loopStopped) {
          animationFrameId = requestAnimationFrame(loop);
        }
        return;
      }
      if (gameOver || player.hp <= 0) {
        const pads = [...navigator.getGamepads()].filter(Boolean);
        const startPressed = pads.some(gp => gp.buttons[9]?.pressed);

        if (startPressed) {
          restartGame();
        }
      }
        if ((gameOver || player.hp <= 0) && restartRequested) {
        restartRequested = false;
        restartGame();
      }
      canvas.style.filter = visorMode === "xray" ? "grayscale(1) brightness(1.18) contrast(1.08)" : "none";
      updatePlayer();
      updateEnemies();
      updateEnemyShots();
      updatePlayerMissiles();
      if (player.hp <= 0) {
        player.hp = 0;
        gameOver = true;
      }
      if (player.shotFx && player.shotFx.timer > 0) player.shotFx.timer--;

      drawBackground();
      drawFloor();
      drawWorld();
      drawXrayPlatforms();
      drawEnemies();
      drawEnemyShots();
      drawPlayerMissiles();
      drawEnemyDiagonalLaserOverlay();
      drawCoordinateGrid();
      drawHeightGuides();
      drawWorldLabels();
      drawPillarASegmentLabels();
      // drawShotHitMarker();
      drawReticle();
      drawShotFx();
      drawGun();
      function drawXrayVisorEffect() {
        if (visorMode !== "xray") return;

        ctx.save();

        // 少し白っぽいXRAY感
        ctx.fillStyle = "rgba(255, 255, 255, 0.18)";
        ctx.fillRect(0, 0, WIDTH, HEIGHT);

        // うっすらスキャンライン
        ctx.strokeStyle = "rgba(255, 255, 255, 0.08)";
        ctx.lineWidth = 1;

        for (let y = 0; y < HEIGHT; y += 8) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(WIDTH, y);
          ctx.stroke();
        }

        ctx.restore();
      }
      drawHUD();
      drawMinimap();
      drawGoalOrb();
      drawDamageFlash();
      if (goalFlashTimer > 0) {
        const alpha = Math.min(1, goalFlashTimer / 60) * 0.9;
        ctx.fillStyle = `rgba(200,255,80,${alpha * 0.14})`;
        ctx.fillRect(0, 0, WIDTH, HEIGHT);
        ctx.save();
        ctx.textAlign = 'center';
        ctx.fillStyle = `rgba(240,255,140,${alpha})`;
        ctx.font = 'bold 80px monospace';
        ctx.fillText('GOAL!', WIDTH / 2, HEIGHT / 2 - 20);
        ctx.font = '26px monospace';
        ctx.fillText('光の玉に辿り着いた！', WIDTH / 2, HEIGHT / 2 + 52);
        ctx.restore();
      }
      drawPadDebugOverlay();
      if (!cleanupDone && !loopStopped) {
        animationFrameId = requestAnimationFrame(loop);
      }
      drawPauseSettingsMenu();
      drawTopHpBarOnly();
      keys["ArrowLeft"] = false;
      keys["ArrowRight"] = false;
      keys["ArrowUp"] = false;
      keys["ArrowDown"] = false;
    }

    ensureLoopRunning();
  </script>
</body>
</html>
