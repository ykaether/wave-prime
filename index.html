<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>Metroid Prime Lite</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at top, #17325e 0%, #060913 54%, #010207 100%);
      font-family: monospace;
      color: #9ffbf5;
    }
    canvas {
      border: 2px solid #42ecff;
      image-rendering: pixelated;
      box-shadow:
        0 0 18px rgba(66, 236, 255, 0.35),
        0 0 42px rgba(255, 92, 194, 0.14);
    }
    #hud {
      margin-top: 10px;
      font-size: 12px;
      color: #98fbff;
    }
  </style>
</head>
<body>
  <canvas id="game" width="1280" height="720"></canvas>
  <div id="hud">WASD move · ←/→ look · X shoot · Shift dash · B jump · ZL/C lock-on · Weapon toggle supported · Pro Controller supported</div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const armCannonImg = new Image();
      armCannonImg.src = "assets/images/arm_cannon_blue.png";
    const enemyGirlImg = new Image();
      enemyGirlImg.src = location.href.includes('/Projects/job_search/')
        ? "file:///Users/yuikitagawa/Documents/metroidvania-prototype/game/ManualEdit/assets/images/enemy_girl.png"
        : "ManualEdit/assets/images/enemy_girl.png";
    const armCannonSound = new Audio('ManualEdit/assets/sounds/arm_cannon_sound.ogg');
    armCannonSound.volume = 0.7;
    const floorTileImg = new Image();
      let floorTilePattern = null;

      floorTileImg.onload = () => {
        floorTilePattern = ctx.createPattern(floorTileImg, 'repeat');
      };

      floorTileImg.src = 'assets/images/floor_blue_grass_tile.png';
    const WIDTH = canvas.width;
    const HEIGHT = canvas.height;
    let visorMode = "normal"; // "normal" or "xray"
    let prevDpadLeftPressed = false;
    let prevDpadRightPressed = false;
    const FOV = Math.PI / 2.4;
    const HALF_FOV = FOV / 2;
    const RAYS = 80;
    const MAX_DEPTH = 18;
    const MOVE_SPEED = 0.052;
    const STRAFE_SPEED = 0.044;
    const TURN_SPEED = 0.017;
    const DASH_MULT = 2.3;
    const AIM_PITCH_SPEED = 0.014;
    const MAX_PITCH = 0.42;
    const CAMERA_EYE_HEIGHT = 1.65;
    const DEFAULT_CAMERA_PITCH = -0.09;
    const JUMP_VEL = 0.162;
    const JUMP_GRAVITY = 0.0042;
    const SHOOT_CD = 12;
    const PLAYER_SHOT_DAMAGE = 1;
    const PLAYER_CHARGE_TIME = 48;
    const PLAYER_CHARGE_THRESHOLD = 0.72;
    const PLAYER_CHARGE_DAMAGE = 3;
    const PLAYER_CHARGE_COOLDOWN = 22;
    const PLAYER_SHOT_FX_TIME = 20;
    const PLAYER_CHARGE_BEAM_TIME = 28;
    const PLAYER_MISSILE_MAX_AMMO = 15;
    const PLAYER_MISSILE_REGEN_TIME = 170;
    const PLAYER_MISSILE_START_SPEED = 0.055;
    const PLAYER_MISSILE_MAX_SPEED = 0.16;
    const PLAYER_MISSILE_ACCEL = 0.0045;
    const PLAYER_MISSILE_LIFE = 110;
    const PLAYER_MISSILE_DAMAGE = 8;
    const PLAYER_MISSILE_SPLASH_RADIUS = 2.1;
    const PLAYER_MISSILE_SPLASH_DAMAGE = 10;
    const LOCK_ON_RANGE = 20;
    const ENEMY_PIXEL_WAVE_BLOCK = 4;
    const ENEMY_PIXEL_WAVE_ALPHA = 0.18;
    const ENEMY_PIXEL_WAVE_SPEED = 0.00022;
    const ENEMY_PIXEL_WAVE_MAX_DIST = 13;
    const COORD_GRID_RADIUS = 11;
    const WAVE_BEAM_STEPS = 30;
    const ENEMY_SHOOT_CD = 125;       // ~38% slower fire rate
    const ENEMY_PREFERRED_DIST = 7.5; // stay at this distance
    const ENEMY_RETREAT_DIST  = 4.5;  // back off if closer than this
    const ENEMY_HOME_X = 30.0;
    const ENEMY_HOME_Y = 15.0;
    const ENEMY_TRIGGER_DISTANCE = 9.5;
    const ENEMY_STAGING_DISTANCE = 4.2;
    const ENEMY_APPROACH_SPEED = 0.029;
    const ENEMY_APPROACH_FALLBACK_TIME = 42;
    const ENEMY_CHARGE_TIME = 30; // ~0.5s at 60fps
    const ENEMY_LUNGE_DISTANCE = 1.15;
    const ENEMY_LUNGE_TIME = 13;
    const ENEMY_RECOVER_TIME = 30;
    const ENEMY_RETURN_SPEED = 0.022;
    const ENEMY_ATTACK_COOLDOWN = 68;
    const ENEMY_CHARGE_ORB_BASE_SIZE = 10;
    const ENEMY_CHARGE_ORB_MAX_SIZE = 30;
    const ENEMY_ATTACK_DAMAGE = 10;
    const ENEMY_FLOAT_BASE_Z = 0.72;
    const ENEMY_FLOAT_BOB_AMPLITUDE = 0.12;
    const ENEMY_ATTACK_REACH = 1.05;
    const ENEMY_SINGLE_SHOT_SPEED = 0.136;
    const ENEMY_SINGLE_SHOT_LIFE = 130;
    const ENEMY_TRIPLE_SHOT_SPEED = 0.124;
    const ENEMY_TRIPLE_SHOT_LIFE = 138;
    const ENEMY_SPIRAL_GATLING_DURATION = 54;
    const ENEMY_SPIRAL_GATLING_INTERVAL = 6;
    const ENEMY_SPIRAL_GATLING_SPEED = 0.13;
    const ENEMY_SPIRAL_GATLING_LIFE = 144;
    const ENEMY_SPIRAL_GATLING_SPREAD = 0.42;
    const ENEMY_SPIRAL_GATLING_SWAY = 0.3;
    const ENEMY_DIAGONAL_LASER_TELL_TIME = 30;
    const ENEMY_DIAGONAL_LASER_FIRE_TIME = 16;
    const ENEMY_DIAGONAL_LASER_WIDTH = 20;
    const ENEMY_DIAGONAL_LASER_DAMAGE = 14;
    const ENEMY_TELEPORT_TELL_TIME = 18;
    const ENEMY_TELEPORT_CHARGE_TIME = 38;
    const ENEMY_TELEPORT_RECOVER_TIME = 18;
    const ENEMY_TELEPORT_DISTANCE_MIN = 4.5;
    const ENEMY_TELEPORT_DISTANCE_MAX = 7.25;
    const ENEMY_ARC_LASER_SPEED = 0.102;
    const ENEMY_ARC_LASER_LIFE = 156;
    const ENEMY_ARC_LASER_SIZE = 1.18;
    const ENEMY_ARC_LASER_DAMAGE = 7;
    const ENEMY_ARC_LASER_CURVE_AMOUNT = 1.25;
    const ENEMY_OVERHEAD_CHARGE_TIME = 90;
    const ENEMY_OVERHEAD_FIRE_TIME = 16;
    const ENEMY_OVERHEAD_ORB_BASE_SIZE = 10;
    const ENEMY_OVERHEAD_ORB_MAX_SIZE = 40;
    const ENEMY_3D_SPREAD_HORIZONTAL_COUNT = 3;
    const ENEMY_3D_SPREAD_VERTICAL_COUNT = 3;
    const ENEMY_3D_SPREAD_HORIZONTAL_ANGLE = 0.22;
    const ENEMY_3D_SPREAD_VERTICAL_OFFSET = 0.28;
    const ENEMY_3D_SPREAD_VERTICAL_VELOCITY = 0.015;
    const ENEMY_3D_SPREAD_SPEED = 0.102;
    const ENEMY_3D_SPREAD_LIFE = 188;
    const ENEMY_3D_SPREAD_SIZE = 1.18;
    const ENEMY_3D_SPREAD_DAMAGE = 9;
    const ENEMY_DEATH_TIME = 45;
    const ENEMY_DEATH_BLINKS = 5;
    const DASH_BURST_SPD = 0.28;      // units per frame during burst
    const DASH_DURATION  = 20;         // frames of dash movement
    const DASH_COOLDOWN  = 10;        // frames before next dash
    const KNOCKBACK_SPD   = 0.36;
    const KNOCKBACK_DECAY = 0.76;
    const ENEMY_MELEE_RANGE  = 1.3;
    const ENEMY_MELEE_CD     = 85;
    const ENEMY_MELEE_DAMAGE = 10;
    const BOSS_SPEED         = 0.095;
    const BOSS_CHARGE_SPD    = 0.46;
    const BOSS_CHARGE_DMG    = 15;
    const BOSS_JUMP_VZ       = 0.32;
    const BOSS_JUMP_DMG      = 8;
    const STEP_HEIGHT = 0.34;
    const FOCAL = WIDTH / (2 * Math.tan(FOV / 2));
    const VIEW_Y_OFFSET = 0;
    const SCENE_BASE_Y = HEIGHT * 0.48;
    const ACTIVE_WORLD = 'World2';

    // 58×34 open arena — slightly expanded for more dodging room
    const MAP = (() => {
      const W = 58, H = 34;
      return Array.from({length: H}, (_, y) =>
        Array.from({length: W}, (_, x) =>
          (x === 0 || x === W - 1 || y === 0 || y === H - 1) ? '1' : '0'
        ).join('')
      );
    })();

    const MAP_W = MAP[0].length;
    const MAP_H = MAP.length;
    const TILE = 1;
    const HEIGHT_ZONES = [
      { x: 3, y: 8, w: 6, h: 7, hgt: -0.34, tint: '#516247' },
      { x: 8, y: 8, w: 3, h: 7, hgt: -0.12, tint: '#617555' },
      { x: 10, y: 7, w: 7, h: 8, hgt: 0.16, tint: '#8faa6d', side: '#596d45', front: '#647b4d' },
      { x: 16, y: 6, w: 4, h: 6, hgt: 0.42, tint: '#a2c37f', side: '#61754a', front: '#6f8653' },
      { x: 20, y: 9, w: 5, h: 6, hgt: 0.72, tint: '#b7da8f', side: '#69804e', front: '#76905a' },
      { x: 12, y: 3, w: 5, h: 3, hgt: 0.22, tint: '#89a46a', side: '#576a43', front: '#61774b' },
      { x: 17, y: 3, w: 4, h: 3, hgt: 0.46, tint: '#a6c980', side: '#647a4b', front: '#729058' },
    ];
    // World1: original raycast-style world, preserved for reference but inactive while ACTIVE_WORLD === 'World2'.

    const keys = {};
    let shootQ = false;
    let missileQ = false;
    let jumpQ = false;
    let dashQ = false;
    let dashHeld = false;
    let lockHeld = false;
    let gpPrev = {};
    let debugPressedButtons = "none";
    let showDebugLabels = false;
    let showHeightGuides = false;
    let showCoordinateGrid = false;
    let pillarAVisible = false;
    let pillarDebugMessage = { text: '', timer: 0 };
    let pillarARenderState = null;
    let shotHitMarker = null;
    let currentAimHit = null;
    const depthBuffer = new Array(RAYS).fill(MAX_DEPTH);
    let goalReached = false;
    let goalFlashTimer = 0;
    let currentWeapon = 'normal';
    const goalOrb = { x: 53.5, y: 16.0, orbZ: 6.2 };
    const STAGE_NAME = 'Room_1_StartArea';
    const PILLAR_A_SEGMENTS = 12;
    const DIFFICULTY_CONFIGS = {
      normal: {
        label: 'NORMAL',
        enemyApproachMul: 1,
        enemyReturnMul: 1,
        enemyCooldownMul: 1,
      },
      hard: {
        label: 'HARD',
        enemyApproachMul: 1.08,
        enemyReturnMul: 1.08,
        enemyCooldownMul: 0.84,
      },
    };
    let selectedDifficulty = 'normal';
    let gameStarted = false;
    let startMenuSelection = 0;
    let gameOver = false;
    let restartRequested = false;
    let gamePaused = false;
    let hpSettingValue = 99;
    let hpSettingInput = "99";
    let pauseMenuSelection = 0;
    let enemyUpdateTick = 0;
    let playerMissileAmmo = PLAYER_MISSILE_MAX_AMMO;
    let playerMissileRegenTimer = 0;
    const managedListeners = [];
    let animationFrameId = null;
    let loopStarted = false;
    let loopStopped = false;
    let cleanupDone = false;
    const DEBUG_LOGS = false;
    const PAUSE_MENU_ITEMS = ["APPLY HP", "GAME RESTART", "RESUME"];

    function clampHpValue(value) {
      return Math.max(1, Math.min(999, Math.round(value)));
    }

    function getDifficultyConfig() {
      return DIFFICULTY_CONFIGS[selectedDifficulty] || DIFFICULTY_CONFIGS.normal;
    }

    function getEnemyAttackCooldownFrames(extra = 0) {
      return Math.max(24, Math.round(ENEMY_ATTACK_COOLDOWN * getDifficultyConfig().enemyCooldownMul) + extra);
    }

    function getEnemyReturnSpeed() {
      return ENEMY_RETURN_SPEED * getDifficultyConfig().enemyReturnMul;
    }

    function syncHpSettingFromPlayer() {
      const currentMaxHp = player.maxHp || player.hp || 99;
      hpSettingValue = clampHpValue(currentMaxHp);
      hpSettingInput = String(hpSettingValue);
    }

    function openPauseMenu() {
      if (!gameStarted) return;
      pauseGame();
      syncHpSettingFromPlayer();
      pauseMenuSelection = 0;
    }

    function closePauseMenu() {
      resumeGame();
    }

    function movePauseMenuSelection(delta) {
      const len = PAUSE_MENU_ITEMS.length;
      pauseMenuSelection = (pauseMenuSelection + delta + len) % len;
    }

    function activatePauseMenuSelection() {
      const item = PAUSE_MENU_ITEMS[pauseMenuSelection];
      if (item === "APPLY HP") {
        applyHpSetting();
        return;
      }
      if (item === "GAME RESTART") {
        restartGame();
        resumeGame();
        return;
      }
      closePauseMenu();
    }

    function togglePauseMenu() {
      if (!gameStarted) return;
      if (gameOver || player.hp <= 0) {
        restartRequested = true;
        return;
      }
      if (gamePaused) {
        closePauseMenu();
      } else {
        openPauseMenu();
      }
    }

    function applyHpSetting() {
      const typedValue = Number(hpSettingInput);
      const nextHp = clampHpValue(
        Number.isFinite(typedValue) && typedValue > 0 ? typedValue : hpSettingValue
      );

      player.maxHp = nextHp;
      player.hp = nextHp;

      hpSettingValue = nextHp;
      hpSettingInput = String(nextHp);

      player.hitFlash = 0;
    }

    function moveStartMenuSelection(delta) {
      startMenuSelection = (startMenuSelection + delta + 2) % 2;
    }

    function toggleSelectedDifficulty(delta = 1) {
      selectedDifficulty = selectedDifficulty === 'normal' ? 'hard' : 'normal';
    }

    function addManagedListener(target, type, handler, options) {
      target.addEventListener(type, handler, options);
      managedListeners.push({ target, type, handler, options });
    }

    function removeManagedListeners() {
      while (managedListeners.length) {
        const { target, type, handler, options } = managedListeners.pop();
        target.removeEventListener(type, handler, options);
      }
    }

    function handleKeyDown(e) {
      if (!gameStarted) {
        if (e.code === "ArrowUp") {
          moveStartMenuSelection(-1);
          e.preventDefault();
          return;
        }
        if (e.code === "ArrowDown") {
          moveStartMenuSelection(1);
          e.preventDefault();
          return;
        }
        if (e.code === "ArrowLeft" || e.code === "ArrowRight") {
          if (startMenuSelection === 0) toggleSelectedDifficulty();
          e.preventDefault();
          return;
        }
        if (e.code === "Enter" || e.code === "NumpadEnter" || e.code === "Space") {
          if (startMenuSelection === 0) {
            toggleSelectedDifficulty();
          } else {
            startGame();
          }
          e.preventDefault();
          return;
        }
      }
      if (gameOver) {
        restartGame();
        e.preventDefault();
        return;
      }
      if (gamePaused) {
        if (e.code === "Escape" || e.code === "KeyP") {
          closePauseMenu();
          e.preventDefault();
          return;
        }

        if (e.code === "Enter" || e.code === "NumpadEnter") {
          activatePauseMenuSelection();
          e.preventDefault();
          return;
        }

        if (e.code === "ArrowLeft") {
          hpSettingValue = clampHpValue(hpSettingValue - 5);
          hpSettingInput = String(hpSettingValue);
          e.preventDefault();
          return;
        }

        if (e.code === "ArrowRight") {
          hpSettingValue = clampHpValue(hpSettingValue + 5);
          hpSettingInput = String(hpSettingValue);
          e.preventDefault();
          return;
        }

        if (e.code === "ArrowUp") {
          movePauseMenuSelection(-1);
          e.preventDefault();
          return;
        }

        if (e.code === "ArrowDown") {
          movePauseMenuSelection(1);
          e.preventDefault();
          return;
        }

        if (/^Digit[0-9]$/.test(e.code)) {
          const digit = e.code.replace("Digit", "");
          hpSettingInput = clampHpValue(Number((hpSettingInput + digit).slice(-3))).toString();
          hpSettingValue = Number(hpSettingInput);
          e.preventDefault();
          return;
        }

        if (/^Numpad[0-9]$/.test(e.code)) {
          const digit = e.code.replace("Numpad", "");
          hpSettingInput = clampHpValue(Number((hpSettingInput + digit).slice(-3))).toString();
          hpSettingValue = Number(hpSettingInput);
          e.preventDefault();
          return;
        }

        if (e.code === "Backspace") {
          hpSettingInput = hpSettingInput.slice(0, -1) || "1";
          hpSettingValue = clampHpValue(Number(hpSettingInput));
          hpSettingInput = String(hpSettingValue);
          e.preventDefault();
          return;
        }

        e.preventDefault();
        return;
      }

      if (e.code === "Escape" || e.code === "Enter" || e.code === "NumpadEnter" || e.code === "KeyP") {
        openPauseMenu();
        e.preventDefault();
        return;
      }
      if (gameOver) {
        restartGame();
        e.preventDefault();
        return;
      }
      keys["ArrowLeft"] = false;
      keys["ArrowRight"] = false;
      keys["ArrowUp"] = false;
      keys["ArrowDown"] = false;

      if ((e.code === "ArrowLeft" || e.code === "ArrowRight") && !e.repeat) {
        if (keys['KeyX'] || keys['KeyY']) {
          currentWeapon = currentWeapon === 'normal' ? 'wave' : 'normal';
        } else {
          visorMode = visorMode === "xray" ? "normal" : "xray";
        }
        e.preventDefault();
        return;
      }

      if (e.code === "ArrowUp" || e.code === "ArrowDown") {
        e.preventDefault();
        return;
      }

      if (e.code === "KeyV" && !e.repeat) {
        visorMode = visorMode === "xray" ? "normal" : "xray";
      }
      if (!keys[e.code] && ['KeyX', 'KeyY'].includes(e.code)) shootQ = true;
      if (e.code === 'KeyR' && !e.repeat) fireMissile();
      if (!keys[e.code] && e.code === 'Space') jumpQ = true;
      if (!keys[e.code] && e.code === 'KeyF') dashQ = true;
      if (!keys[e.code] && e.code === 'KeyL') showDebugLabels = !showDebugLabels;
      if (!keys[e.code] && e.code === 'KeyH') showHeightGuides = !showHeightGuides;
      if (!keys[e.code] && e.code === 'KeyG') showCoordinateGrid = !showCoordinateGrid;
      keys[e.code] = true;
    }

    function handleKeyUp(e) {
      keys[e.code] = false;
      keys["ArrowLeft"] = false;
      keys["ArrowRight"] = false;
      keys["ArrowUp"] = false;
      keys["ArrowDown"] = false;
    }

    function handlePointerDown(e) {
      if (!gameStarted) {
        startGame();
        e.preventDefault();
        return;
      }
      if (gameOver) {
        restartGame();
        e.preventDefault();
      }
    }

    const PLAYER_START = { id: 'Player_Start', x: 24, y: 15, angle: 0 };

    const player = {
      x: PLAYER_START.x,
      y: PLAYER_START.y,
      angle: PLAYER_START.angle,
      pitch: DEFAULT_CAMERA_PITCH,
      height: 0,
      groundHeight: 0,
      vz: 0,
      hp: 99,
      maxHp: 99,
      dashGlow: 0,
      shootCD: 0,
      hitFlash: 0,
      shotFx: null,
      chargeTimer: 0,
      chargeLevel: 0,
      wasShootHeld: false,
      jumpCount: 0,
      lockTarget: null,
      invTimer: 0,
      dashTimer: 0, dashCD: 0, dashDirX: 0, dashDirY: 0,
      knockX: 0, knockY: 0,
      swordFx: null,
    };

    function restartGame() {
      player.x = PLAYER_START.x;
      player.y = PLAYER_START.y;
      player.angle = PLAYER_START.angle;
      player.pitch = DEFAULT_CAMERA_PITCH;

      player.height = 0;
      player.groundHeight = 0;
      player.vz = 0;

      player.hp = player.maxHp || 99;
      player.dashGlow = 0;
      player.shootCD = 0;
      player.hitFlash = 0;
      player.shotFx = null;
      player.lockTarget = null;
      player.chargeTimer = 0;
      player.chargeLevel = 0;
      player.wasShootHeld = false;

      currentAimHit = null;
      shotHitMarker = null;

      enemyBullets.length = 0;
      playerMissiles.length = 0;
      missileBursts.length = 0;
      enemyUpdateTick = 0;
      playerMissileAmmo = PLAYER_MISSILE_MAX_AMMO;
      playerMissileRegenTimer = 0;
      for (const e of enemies) {
        e.x = e.homeX;
        e.y = e.homeY;
        e.z = e.homeZ;
        e.hp = e.maxHp;
        e.dead = false;
        e.invTimer = 0;
        e.state = 'idle';
        e.stateTimer = 0;
        e.approachTimer = 0;
        e.attackCooldown = getEnemyAttackCooldownFrames();
        e.lastAttackTimer = 999;
        e.speed = ENEMY_APPROACH_SPEED * getDifficultyConfig().enemyApproachMul;
        e.attackPattern = 'single';
        e.attackPatternIndex = 0;
        e.patternTimer = 0;
        e.patternBurstCooldown = 0;
        e.lastFireShotTick = -1;
        e.shotFired = false;
        e.attackHit = false;
        e.meleeFx = 0;
        e.orbCharge = 0;
        e.orbGlow = 0;
        e.overheadCharge = 0;
        e.overheadGlow = 0;
        e.teleportTargetX = e.homeX;
        e.teleportTargetY = e.homeY;
        e.deathTimer = 0;
        e.deathAlpha = 1;
      }

      shootQ = false;
      missileQ = false;
      jumpQ = false;
      dashQ = false;
      dashHeld = false;
      lockHeld = false;

      keys["ArrowLeft"] = false;
      keys["ArrowRight"] = false;
      keys["ArrowUp"] = false;
      keys["ArrowDown"] = false;
      keys._shootHeld = false;

      player.knockX = 0;
      player.knockY = 0;
      player.swordFx = null;
      currentWeapon = 'normal';
      goalReached = false;
      goalFlashTimer = 0;
      gameOver = false;
      gamePaused = false;
      restartRequested = false;
      pauseMenuSelection = 0;
    }

    function isRestartScreenActive() {
      return gameOver || player.hp <= 0;
    }

    function forceRestartIfNeeded(e) {
      if (!isRestartScreenActive()) return;

      restartGame();

      if (e) {
        e.preventDefault();
        e.stopPropagation();
      }
    }

    function clearTransientGameObjects() {
      enemyBullets.length = 0;
      playerMissiles.length = 0;
      missileBursts.length = 0;
      currentAimHit = null;
      shotHitMarker = null;
      pillarDebugMessage.timer = 0;
      player.shotFx = null;
      player.swordFx = null;
    }

    function pauseGame() {
      gamePaused = true;
    }

    function stopGame() {
      loopStopped = true;
      if (animationFrameId !== null) {
        cancelAnimationFrame(animationFrameId);
        animationFrameId = null;
      }
    }

    function ensureLoopRunning() {
      if (cleanupDone) return;
      loopStarted = true;
      loopStopped = false;
      if (animationFrameId === null) {
        animationFrameId = requestAnimationFrame(loop);
      }
    }

    function resumeGame() {
      if (cleanupDone) return;
      gamePaused = false;
      ensureLoopRunning();
    }

    function startGame() {
      restartGame();
      gameStarted = true;
      gamePaused = false;
      gameOver = false;

    // Coordinate grid uses the exact same cell size as collision/raycast:
    // one map/collision cell == one coordinate board cell.
    // Grid origin is the world/map origin at cell (0, 0).
    // cellX comes from floor(worldX), cellY comes from floor(worldY).
    // We present y as lettered columns and x as numbered rows.
    function worldToCellIndices(x, y) {
      return {
        cellX: clamp(Math.floor(x), 0, MAP_W - 1),
        cellY: clamp(Math.floor(y), 0, MAP_H - 1),
      };
    }

    function cellIndicesToLabel(cellX, cellY) {
      const col = String.fromCharCode(65 + clamp(cellY, 0, 25));
      const row = clamp(cellX + 1, 1, 99);
      return `${col}${row}`;
    }

    function worldToCell(x, y) {
      const { cellX, cellY } = worldToCellIndices(x, y);
      return cellIndicesToLabel(cellX, cellY);
    }

    function zToHeightLevel(z) {
      const normalized = clamp(Math.round((z + 0.001) * 12), 1, 12);
      return `H${normalized}`;
    }

    function worldToCoordinate(x, y, z) {
      return `${worldToCell(x, y)}-${zToHeightLevel(z)}`;
    }

    function gridCellToWorld(cellX, cellY) {
      return { x: cellX + 0.5, y: cellY + 0.5 };
    }

    function objectToBaseCell(object) {
      if (!object) return null;
      if (typeof object.tileX === 'number' && typeof object.tileY === 'number') {
        return {
          cellX: object.tileX,
          cellY: object.tileY,
          label: cellIndicesToLabel(object.tileX, object.tileY),
        };
      }
      const pos = object.getPosition ? object.getPosition() : object;
      if (!pos) return null;
      const { cellX, cellY } = worldToCellIndices(pos.x, pos.y);
      return { cellX, cellY, label: cellIndicesToLabel(cellX, cellY) };
    }

    function raycastHitToCoordinate(hit) {
      if (!hit || hit.depth >= MAX_DEPTH) return null;
      const { cellX, cellY } = worldToCellIndices(hit.x, hit.y);
      const z = typeof hit.z === 'number' ? hit.z : getGroundHeightAt(hit.x, hit.y);
      return {
        cellX,
        cellY,
        cell: cellIndicesToLabel(cellX, cellY),
        height: zToHeightLevel(z),
        coordinate: `${cellIndicesToLabel(cellX, cellY)}-${zToHeightLevel(z)}`,
        z,
      };
    }

    function projectLabelAnchor(anchor) {
      if (!anchor) return null;
      if (anchor.kind === 'slice') {
        return { x: anchor.x, y: anchor.y, z: anchor.depth || 1 };
      }
      if (anchor.kind === 'world') {
        return project3D(anchor.x, anchor.y, anchor.z);
      }
      return null;
    }

    function isWall(x, y) {
      if (ACTIVE_WORLD === 'World2') return false;
      const mx = Math.floor(x);
      const my = Math.floor(y);
      if (mx < 0 || my < 0 || mx >= MAP_W || my >= MAP_H) return true;
      return MAP[my][mx] === '1';
    }

    function isInsideObjectFootprint(obj, x, y, pad = 0) {
      return x >= obj.x - pad && x < obj.x + obj.w + pad && y >= obj.y - pad && y < obj.y + obj.d + pad;
    }

    function getGridObjectAt(x, y) {
      return GRID_OBJECTS.find(obj => obj.solid && isInsideObjectFootprint(obj, x, y)) || null;
    }

    function getGroundHeightAt(x, y) {
      let best = getBaseGroundHeightAt(x, y);

      for (const obj of PHYSICAL_OBJECTS) {
        if (obj.standable && isInsideObjectFootprint(obj, x, y)) {
          best = Math.max(best, obj.z + obj.h);
        }
      }

    const xrayTop = getXrayPlatformTopAt(x, y);

    if (xrayTop !== null) {
      best = Math.max(best, xrayTop);
    }

      return best;

          if (zone.hgt >= topHeight) {

            tint = zone.tint;

    function getAimVector() {
      if (player.lockTarget && !player.lockTarget.dead && player.lockTarget.state !== 'dying') {
        const target = getEnemyChestAimPoint(player.lockTarget);
        const dx = target.x - player.x;
        const dy = target.y - player.y;
        const dz = target.z - getEyeZ();
        const len = Math.hypot(dx, dy, dz) || 1;
        return {
          x: dx / len,
          y: dy / len,
          z: dz / len,
        };
      }
      const cp = Math.cos(player.pitch);
      return {
        x: Math.cos(player.angle) * cp,
        y: Math.sin(player.angle) * cp,
        z: Math.sin(player.pitch),
      };
    }

    function readGamepad() {
      const gp = [...navigator.getGamepads()].find(g => g);
      if (!gp) {
        gpPrev = {};
        keys._forward = keys._back = keys._left = keys._right = false;
        keys._turnL = keys._turnR = false;
        keys._aimUp = keys._aimDown = false;
        keys._shootHeld = false;
        dashHeld = false;
        lockHeld = false;
        return null;
      }
      const b = i => !!gp.buttons[i]?.pressed;
      const startJustPressed = b(9) && !gpPrev[9];

      if (!gameStarted) {
        if ((b(12) && !gpPrev[12]) || (b(13) && !gpPrev[13])) {
          moveStartMenuSelection(b(12) ? -1 : 1);
        }
        if (((b(14) && !gpPrev[14]) || (b(15) && !gpPrev[15])) && startMenuSelection === 0) {
          toggleSelectedDifficulty();
        }
        if ((b(0) && !gpPrev[0]) || startJustPressed) {
          if (startMenuSelection === 0) {
            toggleSelectedDifficulty();
          } else {
            startGame();
          }
        }
        gpPrev = {};
        for (let i = 0; i < gp.buttons.length; i++) gpPrev[i] = b(i);
        return gp;
      }

      // Game Over中は「押した瞬間」ではなく、Start / + が押されていればrestartする
      if ((gameOver || player.hp <= 0) && b(9)) {
        restartGame();

        gpPrev = {};
        for (let i = 0; i < gp.buttons.length; i++) gpPrev[i] = b(i);

        return gp;
      }

      // 通常時は Start / + でPause切替
      if (startJustPressed) {
        togglePauseMenu();
      }

      if (gamePaused) {
        keys._left = false;
        keys._right = false;
        keys._forward = false;
        keys._back = false;
        keys._turnR = false;
        keys._turnL = false;
        keys._aimUp = false;
        keys._aimDown = false;

        dashHeld = false;
        lockHeld = false;

        // D-pad left/right: HP ±5
        if (b(14) && !gpPrev[14]) {
          hpSettingValue = clampHpValue(hpSettingValue - 5);
          hpSettingInput = String(hpSettingValue);
        }

        if (b(15) && !gpPrev[15]) {
          hpSettingValue = clampHpValue(hpSettingValue + 5);
          hpSettingInput = String(hpSettingValue);
        }

        // D-pad up/down: menu selection
        if (b(12) && !gpPrev[12]) {
          movePauseMenuSelection(-1);
        }

        if (b(13) && !gpPrev[13]) {
          movePauseMenuSelection(1);
        }

        // A: activate selected item
        if (b(0) && !gpPrev[0]) {
          activatePauseMenuSelection();
        }

        // B: close menu
        if (b(1) && !gpPrev[1]) {
          closePauseMenu();
        }

        gpPrev = {};
        for (let i = 0; i < gp.buttons.length; i++) gpPrev[i] = b(i);
        return gp;
      }
      const dpadLeftPressed = !!gp.buttons[14]?.pressed;
      const dpadRightPressed = !!gp.buttons[15]?.pressed;

      const dpadLeftJustPressed = dpadLeftPressed && !prevDpadLeftPressed;
      const dpadRightJustPressed = dpadRightPressed && !prevDpadRightPressed;

      if (dpadLeftJustPressed || dpadRightJustPressed) {
        if (b(3)) {
          currentWeapon = currentWeapon === 'normal' ? 'wave' : 'normal';
        } else {
          visorMode = visorMode === "xray" ? "normal" : "xray";
        }
      }

      prevDpadLeftPressed = dpadLeftPressed;
      prevDpadRightPressed = dpadRightPressed;
      keys._left = gp.axes[0] > 0.28;
      keys._right = gp.axes[0] < -0.28;
      keys._forward = gp.axes[1] < -0.28;
      keys._back = gp.axes[1] > 0.28;
      keys._turnL = gp.axes[2] > 0.28 || b(4);
      keys._turnR = gp.axes[2] < -0.28 || b(5);
      keys._aimUp = gp.axes[3] < -0.22;
      keys._aimDown = gp.axes[3] > 0.22;
      keys._shootHeld = b(2);
      dashHeld = b(7);
      lockHeld = b(6);
      if (b(0) && !gpPrev[0]) jumpQ = true;
      if (b(7) && !gpPrev[7]) dashQ = true;
      if (b(2) && !gpPrev[2]) shootQ = true;
      gpPrev = {};
      const pressedButtonIds = [];

      for (let i = 0; i < gp.buttons.length; i++) {
        if (b(i)) pressedButtonIds.push(i);
      }

      debugPressedButtons = pressedButtonIds.length
        ? pressedButtonIds.join(", ")
        : "none";
      for (let i = 0; i < gp.buttons.length; i++) gpPrev[i] = b(i);
      return gp;
    }

    function isShootHeld() {
      return !!(keys.KeyX || keys.KeyY || keys._shootHeld);
    }

    function isEnemyOverlappingAt(movingEnemy, nx, ny, padding = 0.35) {
      const aLeft = nx - padding;
      const aRight = nx + movingEnemy.w + padding;
      const aTop = ny - padding;
      const aBottom = ny + movingEnemy.d + padding;

      for (const other of enemies) {
        if (other === movingEnemy) continue;
        if (other.dead) continue;

        const bLeft = other.x;
        const bRight = other.x + other.w;
        const bTop = other.y;
        const bBottom = other.y + other.d;

        const overlaps =
          aLeft < bRight &&
          aRight > bLeft &&
          aTop < bBottom &&
          aBottom > bTop;

        if (overlaps) return true;
      }

      return false;
    }

    function tryEnemyMove(e, nx, ny) {
      const pad = 0.16;
      if (isEnemyOverlappingAt(e, nx, ny, 0.35)) return false;
      if (!isInsideWorld2Bounds(nx, ny, pad)) return false;
      for (const obj of PHYSICAL_OBJECTS) {
        if (!obj.blocksMovement) continue;
        if (isInsideObjectFootprint(obj, nx-pad, ny) || isInsideObjectFootprint(obj, nx+pad, ny) ||
            isInsideObjectFootprint(obj, nx, ny-pad) || isInsideObjectFootprint(obj, nx, ny+pad)) return false;
      }
      e.x = nx; e.y = ny;
      return true;
    }

    function tryMove(nx, ny) {
      const pad = 0.18;
      if (ACTIVE_WORLD === 'World2') {
        if (!isInsideWorld2Bounds(nx, ny, pad)) return;
      } else {
        if (isWall(nx - pad, ny) || isWall(nx + pad, ny) || isWall(nx, ny - pad) || isWall(nx, ny + pad)) return;
      }
      for (const obj of PHYSICAL_OBJECTS) {
        if (!obj.blocksMovement) continue;
        if (
          isInsideObjectFootprint(obj, nx - pad, ny) ||
          isInsideObjectFootprint(obj, nx + pad, ny) ||
          isInsideObjectFootprint(obj, nx, ny - pad) ||
          isInsideObjectFootprint(obj, nx, ny + pad)
        ) return;
      }
      const nextGround = getGroundHeightAt(nx, ny);
      const currentGround = player.groundHeight;
      const canStepUp = nextGround <= currentGround + STEP_HEIGHT || player.height > currentGround + 0.04 || player.vz > 0;
      if (!canStepUp) return;
      player.x = nx;
      player.y = ny;
    }

    function updatePlayer() {
      readGamepad();
      if (player.shootCD > 0) player.shootCD--;
      if (player.dashGlow > 0) player.dashGlow--;
      if (player.hitFlash > 0) player.hitFlash--;
      if (player.invTimer > 0) player.invTimer--;
      if (player.dashCD  > 0) player.dashCD--;
      if (pillarDebugMessage.timer > 0) pillarDebugMessage.timer--;
      if (shotHitMarker && shotHitMarker.timer > 0) shotHitMarker.timer--;
      const lockActive = lockHeld || !!keys.KeyC;
      const moveMult = (keys.ShiftLeft || keys.ShiftRight || dashHeld) ? DASH_MULT : 1;
      if (moveMult > 1) player.dashGlow = 6;

      const lockInfo = getLockCandidate();
      player.lockTarget = lockActive ? lockInfo?.enemy || null : null;

      if (player.lockTarget) {
        const e = player.lockTarget;
        const chest = getEnemyChestAimPoint(e);
        const aimX = chest.x;
        const aimY = chest.y;
        const dx = aimX - player.x;
        const dy = aimY - player.y;
        const dz = chest.z - getEyeZ();
        const targetAngle = Math.atan2(dy, dx);
        const targetPitch = Math.atan2(dz, Math.hypot(dx, dy) || 0.001);
        player.angle = targetAngle;
        player.pitch = clamp(targetPitch, -MAX_PITCH, MAX_PITCH);
      } else {
        if (keys.ArrowLeft || keys.KeyQ || keys._turnL) player.angle -= TURN_SPEED;
        if (keys.ArrowRight || keys.KeyE || keys._turnR) player.angle += TURN_SPEED;
        if (keys._aimUp) player.pitch += AIM_PITCH_SPEED;
        if (keys._aimDown) player.pitch -= AIM_PITCH_SPEED;
        if (keys.PageUp) player.pitch += AIM_PITCH_SPEED;
        if (keys.PageDown) player.pitch -= AIM_PITCH_SPEED;
        player.pitch = clamp(player.pitch, -MAX_PITCH, MAX_PITCH);
      }

      let step = 0;
      let strafe = 0;
      if (keys.KeyW || keys.ArrowUp || keys._forward) step += MOVE_SPEED * moveMult;
      if (keys.KeyS || keys.ArrowDown || keys._back) step -= MOVE_SPEED * moveMult;
      // lock-on sidestep: 2.5x strafe boost when locked on
      const sidestepMult = player.lockTarget ? 2.5 : 1;
      if (keys.KeyA || keys._left) { strafe -= STRAFE_SPEED * moveMult * sidestepMult; if (player.lockTarget) player.dashGlow = 10; }
      if (keys.KeyD || keys._right) { strafe += STRAFE_SPEED * moveMult * sidestepMult; if (player.lockTarget) player.dashGlow = 10; }

      const dx = Math.cos(player.angle);
      const dy = Math.sin(player.angle);
      const sx = Math.cos(player.angle + Math.PI / 2);
      const sy = Math.sin(player.angle + Math.PI / 2);

      // Initiate burst dash (A button / F key)
      if (dashQ && player.dashCD === 0) {
        const moveX = dx * step + sx * strafe;
        const moveY = dy * step + sy * strafe;
        const moveLen = Math.hypot(moveX, moveY);
        if (moveLen > 0.001) {
          player.dashDirX = moveX / moveLen;
          player.dashDirY = moveY / moveLen;
        } else {
          player.dashDirX = dx;
          player.dashDirY = dy;
        }
        player.dashTimer = DASH_DURATION;
        player.dashCD = DASH_COOLDOWN;
        player.dashGlow = 20;
      }
      dashQ = false;

      tryMove(player.x + dx * step + sx * strafe, player.y + dy * step + sy * strafe);

      // Apply burst dash on top of normal movement
      if (player.dashTimer > 0) {
        player.dashTimer--;
        tryMove(player.x + player.dashDirX * DASH_BURST_SPD, player.y + player.dashDirY * DASH_BURST_SPD);
        player.dashGlow = Math.max(player.dashGlow, player.dashTimer + 5);
      }

      if (player.knockX !== 0 || player.knockY !== 0) {
        tryMove(player.x + player.knockX, player.y + player.knockY);
        player.knockX *= KNOCKBACK_DECAY;
        player.knockY *= KNOCKBACK_DECAY;
        if (Math.hypot(player.knockX, player.knockY) < 0.004) { player.knockX = 0; player.knockY = 0; }
      }

      const _playerMidZ = player.height + 0.9;
      const _d3 = Math.sqrt((player.x-goalOrb.x)**2 + (player.y-goalOrb.y)**2 + (_playerMidZ-goalOrb.orbZ)**2);
      if (!goalReached && _d3 < 2.5) {
        goalReached = true;
        goalFlashTimer = 300;
      }
      if (goalFlashTimer > 0) goalFlashTimer--;

      if (jumpQ && (player.height <= player.groundHeight + 0.001 || player.jumpCount < 2)) {
        player.vz = JUMP_VEL;
        player.jumpCount++;
      }
      jumpQ = false;
      player.vz -= JUMP_GRAVITY;
      player.height += player.vz;
      const ground = getGroundHeightAt(player.x, player.y);
      player.groundHeight = ground;
      // snap to ground: always for base ground (z=0), only when falling for platforms
      if (player.height <= ground && (player.vz <= 0 || ground <= 0.001)) {
        player.height = ground;
        player.vz = 0;
        player.jumpCount = 0;
      }

      currentAimHit = castRay(player.angle);

      if (player.swordFx && player.swordFx.timer > 0) player.swordFx.timer--;

      const shootHeldNow = isShootHeld();
      if (shootHeldNow && player.shootCD === 0) {
        player.chargeTimer = Math.min(PLAYER_CHARGE_TIME, player.chargeTimer + 1);
      }
      player.chargeLevel = clamp(player.chargeTimer / PLAYER_CHARGE_TIME, 0, 1);

      const shootReleased = player.wasShootHeld && !shootHeldNow;
      if (shootReleased && player.shootCD === 0) {
        const chargeLevel = player.chargeLevel;
        const charged = chargeLevel >= PLAYER_CHARGE_THRESHOLD;
        player.shootCD = charged ? PLAYER_CHARGE_COOLDOWN : SHOOT_CD;
        fireShot(charged, chargeLevel);
        player.chargeTimer = 0;
        player.chargeLevel = 0;
      } else if (!shootHeldNow && !player.wasShootHeld) {
        player.chargeTimer = 0;
        player.chargeLevel = 0;
      }
      shootQ = false;
      if (playerMissileAmmo < PLAYER_MISSILE_MAX_AMMO) {
        playerMissileRegenTimer++;
        if (playerMissileRegenTimer >= PLAYER_MISSILE_REGEN_TIME) {
          playerMissileAmmo++;
          playerMissileRegenTimer = 0;
        }
      } else {
        playerMissileRegenTimer = 0;
      }
      missileQ = false;
      player.wasShootHeld = shootHeldNow;
    }

    function fireSword() {
      player.swordFx = null;
    }

    function updateEnemies() {
      if (gamePaused || gameOver) return;
      enemyUpdateTick++;
      for (const e of enemies) {
        if (e.dead) continue;
        if (e.state === 'dying') {
          e.deathTimer = Math.max(0, e.deathTimer - 1);
          e.deathAlpha = clamp(e.deathTimer / ENEMY_DEATH_TIME, 0, 1);
          e.stateTimer = e.deathTimer;
          if (e.deathTimer <= 0) {
            e.dead = true;
          }
          continue;
        }
        if (e.invTimer > 0) e.invTimer--;
        if (e.meleeFx > 0) e.meleeFx--;
        if (e.attackCooldown > 0) e.attackCooldown--;
        e.lastAttackTimer++;
        e.speed = ENEMY_APPROACH_SPEED * getDifficultyConfig().enemyApproachMul;

        e.bobPhase += 0.05;
        e.z = e.homeZ + Math.sin(e.bobPhase) * ENEMY_FLOAT_BOB_AMPLITUDE;

        const cx = e.x + e.w / 2;
        const cy = e.y + e.d / 2;
        const dx = player.x - cx;
        const dy = player.y - cy;
        const dist = Math.hypot(dx, dy) || 0.001;
        const dirX = dx / dist;
        const dirY = dy / dist;
        e.angle = Math.atan2(dy, dx);

        const homeDx = e.homeX - e.x;
        const homeDy = e.homeY - e.y;
        const homeDist = Math.hypot(homeDx, homeDy) || 0.001;

        e.orbCharge = 0;
        e.orbGlow = 0;
        e.overheadCharge = 0;
        e.overheadGlow = 0;

        switch (e.state) {
          case 'idle': {
            e.approachTimer = 0;
            if (homeDist > 0.06) {
              const step = Math.min(getEnemyReturnSpeed(), homeDist);
              tryEnemyMove(e, e.x + (homeDx / homeDist) * step, e.y + (homeDy / homeDist) * step);
            }
            if (e.attackCooldown <= 0) {
              e.state = 'approach';
              e.approachTimer = 0;
            }
            break;
          }
          case 'approach': {
            e.approachTimer++;
            const desired = ENEMY_STAGING_DISTANCE;
            if (dist > desired + 0.18) {
              const step = Math.min(e.speed, dist - desired);
              tryEnemyMove(e, e.x + dirX * step, e.y + dirY * step);
            } else if (dist < desired - 0.22) {
              const step = Math.min(e.speed * 0.8, desired - dist);
              tryEnemyMove(e, e.x - dirX * step, e.y - dirY * step);
            }
            if (
              (dist <= desired + 0.28 && dist >= desired - 0.4) ||
              e.approachTimer >= ENEMY_APPROACH_FALLBACK_TIME
            ) {
              e.state = 'charge';
              e.stateTimer = ENEMY_CHARGE_TIME;
              e.approachTimer = 0;
            }
            break;
          }
          case 'charge': {
            e.stateTimer--;
            e.orbCharge = 1 - e.stateTimer / ENEMY_CHARGE_TIME;
            e.orbGlow = 1;
            if (e.stateTimer <= 0) {
              e.attackDirX = dirX;
              e.attackDirY = dirY;
              e.lungeStartX = e.x;
              e.lungeStartY = e.y;
              e.lungeProgress = 0;
              e.attackHit = false;
              e.shotFired = false;
              e.state = 'lunge_attack';
              e.stateTimer = ENEMY_LUNGE_TIME;
              e.meleeFx = ENEMY_LUNGE_TIME;
            }
            break;
          }
          case 'lunge_attack': {
            const progress = 1 - e.stateTimer / ENEMY_LUNGE_TIME;
            e.lungeProgress = progress;
            e.orbCharge = 1;
            e.orbGlow = 1;
            if (!e.shotFired) {
              chooseEnemyAttackPattern(e);
              if (e.attackPattern === 'teleport_arc_burst') {
                const dest = chooseEnemyTeleportDestination(e);
                e.teleportTargetX = dest.x;
                e.teleportTargetY = dest.y;
                e.state = 'teleport_tell';
                e.stateTimer = ENEMY_TELEPORT_TELL_TIME;
                e.shotFired = true;
                e.lastAttackTimer = 0;
                break;
              }
              if (e.attackPattern === 'charged_3d_spread') {
                e.state = 'overhead_charge';
                e.stateTimer = ENEMY_OVERHEAD_CHARGE_TIME;
                e.shotFired = true;
                e.lastAttackTimer = 0;
                break;
              }
              updateEnemyAttackPattern(e);
              e.shotFired = true;
              e.lastAttackTimer = 0;
            }
            const targetX = e.lungeStartX + e.attackDirX * ENEMY_LUNGE_DISTANCE;
            const targetY = e.lungeStartY + e.attackDirY * ENEMY_LUNGE_DISTANCE;
            const moveX = e.x + (targetX - e.x) * 0.45;
            const moveY = e.y + (targetY - e.y) * 0.45;
            tryEnemyMove(e, moveX, moveY);

            const handX = e.x + e.w / 2 + e.attackDirX * 0.5 - e.attackDirY * 0.12;
            const handY = e.y + e.d / 2 + e.attackDirY * 0.5 + e.attackDirX * 0.12;
            const strikeX = handX + e.attackDirX * 0.95;
            const strikeY = handY + e.attackDirY * 0.95;
            const strikeDist = Math.hypot(player.x - strikeX, player.y - strikeY);

            if (!e.attackHit && strikeDist <= ENEMY_ATTACK_REACH && player.invTimer === 0) {
              player.hp = Math.max(0, player.hp - ENEMY_ATTACK_DAMAGE);
              player.hitFlash = 15;
              player.invTimer = 28;
              player.knockX += e.attackDirX * KNOCKBACK_SPD * 2.2;
              player.knockY += e.attackDirY * KNOCKBACK_SPD * 2.2;
              e.attackHit = true;
            }

            updateEnemyAttackPattern(e);

            e.stateTimer = Math.max(0, e.stateTimer - 1);
            if (e.patternTimer > 0) {
              e.stateTimer = Math.max(e.stateTimer, 1);
            }
            if (e.stateTimer <= 0 && e.patternTimer <= 0) {
              e.state = 'recover';
              e.stateTimer = ENEMY_RECOVER_TIME;
              e.lungeProgress = 0;
              e.attackCooldown = getEnemyAttackCooldownFrames();
              e.patternTimer = 0;
              e.patternBurstCooldown = 0;
            }
            break;
          }
          case 'teleport_tell': {
            e.orbCharge = 0.25;
            e.orbGlow = 0.5;
            e.stateTimer--;
            if (e.stateTimer <= 0) {
              e.x = e.teleportTargetX;
              e.y = e.teleportTargetY;
              e.state = 'teleport_charge';
              e.stateTimer = ENEMY_TELEPORT_CHARGE_TIME;
            }
            break;
          }
          case 'teleport_charge': {
            e.orbCharge = 1 - e.stateTimer / ENEMY_TELEPORT_CHARGE_TIME;
            e.orbGlow = 1;
            e.angle = Math.atan2(player.y - (e.y + e.d / 2), player.x - (e.x + e.w / 2));
            e.stateTimer--;
            if (e.stateTimer <= 0) {
              e.state = 'teleport_arc_burst';
              e.stateTimer = 12;
              e.shotFired = false;
            }
            break;
          }
          case 'teleport_arc_burst': {
            e.orbCharge = 1;
            e.orbGlow = 1;
            if (!e.shotFired) {
              fireEnemyTeleportArcBurst(e);
              e.shotFired = true;
              e.lastAttackTimer = 0;
            }
            e.stateTimer--;
            if (e.stateTimer <= 0) {
              e.state = 'recover';
              e.stateTimer = ENEMY_TELEPORT_RECOVER_TIME;
              e.attackCooldown = getEnemyAttackCooldownFrames();
              e.patternTimer = 0;
              e.patternBurstCooldown = 0;
            }
            break;
          }
          case 'overhead_charge': {
            e.overheadCharge = 1 - e.stateTimer / ENEMY_OVERHEAD_CHARGE_TIME;
            e.overheadGlow = 1;
            e.orbGlow = 0.35;
            e.angle = Math.atan2(player.y - (e.y + e.d / 2), player.x - (e.x + e.w / 2));
            e.stateTimer--;
            if (e.stateTimer <= 0) {
              e.state = 'overhead_fire';
              e.stateTimer = ENEMY_OVERHEAD_FIRE_TIME;
              e.shotFired = false;
            }
            break;
          }
          case 'overhead_fire': {
            e.overheadCharge = 1;
            e.overheadGlow = 1;
            if (!e.shotFired) {
              fireEnemyCharged3DSpread(e);
              e.shotFired = true;
              e.lastAttackTimer = 0;
            }
            e.stateTimer--;
            if (e.stateTimer <= 0) {
              e.state = 'recover';
              e.stateTimer = ENEMY_RECOVER_TIME;
              e.attackCooldown = getEnemyAttackCooldownFrames(18);
              e.patternTimer = 0;
              e.patternBurstCooldown = 0;
            }
            break;
          }
          case 'recover': {
            e.orbCharge = 0.35;
            e.stateTimer--;
            if (e.stateTimer <= 0) {
              e.state = 'return_home';
              e.stateTimer = Math.max(16, Math.round(22 * getDifficultyConfig().enemyCooldownMul));
            }
            break;
          }
          case 'return_home': {
            if (homeDist > 0.08) {
              const step = Math.min(getEnemyReturnSpeed(), homeDist);
              tryEnemyMove(e, e.x + (homeDx / homeDist) * step, e.y + (homeDy / homeDist) * step);
            } else {
              e.x = e.homeX;
              e.y = e.homeY;
              e.state = 'idle';
              e.approachTimer = 0;
            }
            break;
          }
        }
      }
    }

    function getLockCandidate() {
      let best = null;
      let bestDist = Infinity;
      for (const e of enemies) {
        if (e.dead || e.state === 'dying') continue;
        const cx = e.x + e.w / 2, cy = e.y + e.d / 2;
        const dist = Math.hypot(cx - player.x, cy - player.y);
        if (dist > LOCK_ON_RANGE) continue;
        let ang = Math.atan2(cy - player.y, cx - player.x) - player.angle;
        while (ang > Math.PI) ang -= Math.PI * 2;
        while (ang < -Math.PI) ang += Math.PI * 2;
        if (Math.abs(ang) > HALF_FOV + 0.1) continue;
        if (dist < bestDist) { best = e; bestDist = dist; }
      }
      return best ? { enemy: best } : null;
    }

    function beginEnemyDeath(e) {
      if (e.dead || e.state === 'dying') return;
      e.hp = 0;
      e.state = 'dying';
      e.stateTimer = ENEMY_DEATH_TIME;
      e.deathTimer = ENEMY_DEATH_TIME;
      e.deathAlpha = 1;
      e.attackCooldown = 9999;
      e.patternTimer = 0;
      e.patternBurstCooldown = 0;
      e.shotFired = true;
      e.attackHit = true;
      e.orbCharge = 0;
      e.orbGlow = 0;
      e.overheadCharge = 0;
      e.overheadGlow = 0;
      e.meleeFx = 0;
    }

    function fireMissile() {
      if (gamePaused || gameOver || playerMissileAmmo <= 0) return;
      playerMissileAmmo--;
      playerMissileRegenTimer = 0;
      // Keep missile motion easy to read in the 2.5D view:
      // spawn it a bit ahead of the player and fly mostly parallel to the floor.
      const ang = player.angle;
      const spawnForward = 1.0;
      const dirX = Math.cos(ang);
      const dirY = Math.sin(ang);
      const muzzleX = player.x + dirX * spawnForward;
      const muzzleY = player.y + dirY * spawnForward;
      const missileZ = Math.max(getGroundHeightAt(player.x, player.y) + 0.95, getEyeZ() - 0.62);
      playerMissiles.push({
        x: muzzleX,
        y: muzzleY,
        z: missileZ,
        vx: dirX * PLAYER_MISSILE_START_SPEED,
        vy: dirY * PLAYER_MISSILE_START_SPEED,
        vz: 0,
        dirX,
        dirY,
        dirZ: 0,
        speed: PLAYER_MISSILE_START_SPEED,
        life: PLAYER_MISSILE_LIFE,
        age: 0,
      });
    }

    function explodePlayerMissile(missile) {
      missileBursts.push({
        x: missile.x,
        y: missile.y,
        z: missile.z,
        timer: 16,
        radius: PLAYER_MISSILE_SPLASH_RADIUS,
      });
      for (const e of enemies) {
        if (e.dead || e.state === 'dying') continue;
        const ex = e.x + e.w / 2;
        const ey = e.y + e.d / 2;
        const ez = e.z + e.h * 0.5;
        const dist = Math.hypot(ex - missile.x, ey - missile.y, ez - missile.z);
        if (dist > PLAYER_MISSILE_SPLASH_RADIUS) continue;
        const damage = dist < 0.7 ? PLAYER_MISSILE_DAMAGE : PLAYER_MISSILE_SPLASH_DAMAGE;
        e.hp = Math.max(0, e.hp - damage);
        e.invTimer = 20;
        if (e.hp <= 0) beginEnemyDeath(e);
      }
    }

    function fireShot(charged = false, chargeLevel = 0) {
      armCannonSound.currentTime = 0;
      armCannonSound.play().catch(() => {});
      const wallHit = currentAimHit || castRay(player.angle);
      const aimVec = getAimVector();
      const fxDepth = wallHit && wallHit.depth < MAX_DEPTH ? wallHit.depth : 8;
      const chargeScale = charged ? Math.max(1, 1 + chargeLevel * 1.8) : 1;
      const shotMode = currentWeapon === 'wave' ? 'wave' : 'normal';
      player.shotFx = {
        timer: charged ? PLAYER_CHARGE_BEAM_TIME : PLAYER_SHOT_FX_TIME,
        x: wallHit && wallHit.depth < MAX_DEPTH ? wallHit.x : player.x + aimVec.x * fxDepth,
        y: wallHit && wallHit.depth < MAX_DEPTH ? wallHit.y : player.y + aimVec.y * fxDepth,
        z: wallHit && wallHit.depth < MAX_DEPTH ? wallHit.z : getAimHeightAtDepth(fxDepth),
        charged,
        chargeLevel,
        chargeScale,
        mode: shotMode,
      };

      if (wallHit && wallHit.hitType === 'enemy' && wallHit.enemy) {
        const e = wallHit.enemy;
        if (e.invTimer === 0 && e.state !== 'dying') {
          const damage = charged ? Math.max(PLAYER_CHARGE_DAMAGE, Math.round(PLAYER_CHARGE_DAMAGE * chargeLevel)) : PLAYER_SHOT_DAMAGE;
          e.hp = Math.max(0, e.hp - damage);
          e.invTimer = 30;
          if (e.hp <= 0) beginEnemyDeath(e);
          shotHitMarker = {
            x: wallHit.x, y: wallHit.y,
            z: wallHit.z + 0.1,
            text: `HIT ${e.label}  HP:${e.hp}/${e.maxHp}`,
            timer: 70,
          };
          setPillarDebugMessage(`Hit ${e.label}`, 70);
        }
      }

      if (wallHit && wallHit.depth < MAX_DEPTH && wallHit.hitType !== 'enemy') {
        const hitTileX = Math.floor(wallHit.x);
        const hitTileY = Math.floor(wallHit.y);
        const isCurrentPillarA = currentPillarA && hitTileX === currentPillarA.tileX && hitTileY === currentPillarA.tileY;
        const hitLabel = wallHit.object ? wallHit.object.label : (wallHit.hitType === 'floor' ? 'Floor' : cellIndicesToLabel(hitTileX, hitTileY));
        shotHitMarker = {
          x: wallHit.x,
          y: wallHit.y,
          z: wallHit.hitType === 'floor' ? wallHit.z + 0.12 : clamp(wallHit.z, getGroundHeightAt(wallHit.x, wallHit.y) + 0.2, getGroundHeightAt(wallHit.x, wallHit.y) + 1.4),
          text: isCurrentPillarA ? 'HIT Pillar_A' : `Hit ${hitLabel}`,
          timer: 70,
        };
        if (DEBUG_LOGS) {
          console.log('Shot wall hit', {
            hitCell: `${hitTileX},${hitTileY}`,
            hitWorldPosition: { x: wallHit.x, y: wallHit.y },
            hitDistance: wallHit.depth,
            isCurrentPillarA,
            currentPillarA: currentPillarA ? {
              id: currentPillarA.id,
              cell: `${currentPillarA.tileX},${currentPillarA.tileY}`,
              worldPosition: { x: currentPillarA.x, y: currentPillarA.y },
            } : null,
          });
        }
        if (isCurrentPillarA) {
          setPillarDebugMessage('HIT Pillar_A', 70);
        } else {
          setPillarDebugMessage(`Shot hit ${cellIndicesToLabel(hitTileX, hitTileY)}`, 70);
        }
      }
    }

    function spawnEnemyBullet(e, angle, speed = 0.12, size = 1.0, wave = false, options = {}) {
      const perpAng = angle + Math.PI / 2;
      const startX = options.startX ?? (e.x + e.w / 2);
      const startY = options.startY ?? (e.y + e.d / 2);
      const startZ = options.startZ ?? (e.z + e.h * (options.zFactor ?? 0.7) + (options.zOffset ?? 0));
      enemyBullets.push({
        x: startX, y: startY,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        z: startZ,
        vz: options.vz ?? 0,
        life: options.life ?? 90,
        maxLife: options.life ?? 90,
        size,
        damage: options.damage ?? 5,
        tint: options.tint ?? (wave ? 'wave' : 'single'),
        wave, wavePerpX: Math.cos(perpAng), wavePerpY: Math.sin(perpAng),
        arc: options.arc ?? false,
        curveSign: options.curveSign ?? 0,
        curveAmount: options.curveAmount ?? 0,
        arcPrevOffset: 0,
      });
    }

    function fireEnemyShot(e, angleOverride = null) {
      const ang = angleOverride ?? Math.atan2(player.y - (e.y + e.d / 2), player.x - (e.x + e.w / 2));
      e.lastFireShotTick = enemyUpdateTick;
      spawnEnemyBullet(e, ang, ENEMY_SINGLE_SHOT_SPEED, 1.18, false, {
        life: ENEMY_SINGLE_SHOT_LIFE,
        zOffset: 0.04,
        tint: 'single',
      });
    }

    function fireEnemySingleShot(e) {
      fireEnemyShot(e);
    }

    function fireEnemyTripleWaveShot(e) {
      const baseAngle = Math.atan2(player.y - (e.y + e.d / 2), player.x - (e.x + e.w / 2));
      e.lastFireShotTick = enemyUpdateTick;
      spawnEnemyBullet(e, baseAngle, ENEMY_TRIPLE_SHOT_SPEED, 1.12, false, {
        life: ENEMY_TRIPLE_SHOT_LIFE,
        zOffset: 0.02,
        tint: 'triple',
      });
      spawnEnemyBullet(e, baseAngle - 0.22, ENEMY_TRIPLE_SHOT_SPEED, 1.0, true, {
        life: ENEMY_TRIPLE_SHOT_LIFE,
        zOffset: -0.03,
        tint: 'wave',
      });
      spawnEnemyBullet(e, baseAngle + 0.22, ENEMY_TRIPLE_SHOT_SPEED, 1.0, true, {
        life: ENEMY_TRIPLE_SHOT_LIFE,
        zOffset: 0.07,
        tint: 'wave',
      });
    }

    function fireEnemySpiralGatlingShot(e) {
      const baseAngle = Math.atan2(player.y - (e.y + e.d / 2), player.x - (e.x + e.w / 2));
      const phase = (ENEMY_SPIRAL_GATLING_DURATION - e.patternTimer) * 0.28;
      const offsets = [-ENEMY_SPIRAL_GATLING_SPREAD, 0, ENEMY_SPIRAL_GATLING_SPREAD];
      e.lastFireShotTick = enemyUpdateTick;
      offsets.forEach((offset, index) => {
        const angle = baseAngle + offset + Math.sin(phase + index * 0.8) * ENEMY_SPIRAL_GATLING_SWAY;
        spawnEnemyBullet(e, angle, ENEMY_SPIRAL_GATLING_SPEED, 0.98 + index * 0.08, index !== 1, {
          life: ENEMY_SPIRAL_GATLING_LIFE,
          zOffset: (index - 1) * 0.05,
          tint: index === 1 ? 'single' : 'wave',
        });
      });
    }

    function canEnemyOccupyPosition(e, nx, ny) {
      const pad = 0.16;
      if (!isInsideWorld2Bounds(nx, ny, pad)) return false;
      if (isEnemyOverlappingAt(e, nx, ny, 0.35)) return false;
      for (const obj of PHYSICAL_OBJECTS) {
        if (obj.hidden || !obj.blocksMovement) continue;
        if (
          isInsideObjectFootprint(obj, nx - pad, ny) ||
          isInsideObjectFootprint(obj, nx + pad, ny) ||
          isInsideObjectFootprint(obj, nx, ny - pad) ||
          isInsideObjectFootprint(obj, nx, ny + pad)
        ) return false;
      }
      return true;
    }

    function chooseEnemyTeleportDestination(e) {
      const candidateAngles = [
        player.angle - 0.85,
        player.angle + 0.85,
        player.angle - 0.45,
        player.angle + 0.45,
        player.angle + Math.PI - 0.7,
      ];
      const candidateDistances = [
        ENEMY_TELEPORT_DISTANCE_MIN,
        (ENEMY_TELEPORT_DISTANCE_MIN + ENEMY_TELEPORT_DISTANCE_MAX) * 0.5,
        ENEMY_TELEPORT_DISTANCE_MAX,
      ];

      for (const angle of candidateAngles.sort(() => Math.random() - 0.5)) {
        for (const dist of candidateDistances) {
          const nx = player.x + Math.cos(angle) * dist;
          const ny = player.y + Math.sin(angle) * dist;
          if (canEnemyOccupyPosition(e, nx, ny)) {
            return { x: nx, y: ny };
          }
        }
      }

      if (canEnemyOccupyPosition(e, e.homeX, e.homeY)) {
        return { x: e.homeX, y: e.homeY };
      }
      return { x: e.x, y: e.y };
    }

    function fireEnemyTeleportArcBurst(e) {
      const baseAngle = Math.atan2(player.y - (e.y + e.d / 2), player.x - (e.x + e.w / 2));
      e.lastFireShotTick = enemyUpdateTick;
      [-1, 0, 1].forEach((curveSign, index) => {
        spawnEnemyBullet(e, baseAngle + curveSign * 0.04, ENEMY_ARC_LASER_SPEED, ENEMY_ARC_LASER_SIZE + index * 0.06, false, {
          life: ENEMY_ARC_LASER_LIFE,
          zOffset: 0.08 + index * 0.03,
          tint: 'arc',
          damage: ENEMY_ARC_LASER_DAMAGE,
          arc: true,
          curveSign,
          curveAmount: ENEMY_ARC_LASER_CURVE_AMOUNT * (curveSign === 0 ? 0.45 : 1),
        });
      });
    }

    function fireEnemyCharged3DSpread(e) {
      const startX = e.x + e.w / 2;
      const startY = e.y + e.d / 2;
      const startZ = e.z + e.h + 0.62;
      const baseAngle = Math.atan2(player.y - startY, player.x - startX);
      e.lastFireShotTick = enemyUpdateTick;
      const hCount = ENEMY_3D_SPREAD_HORIZONTAL_COUNT;
      const vCount = ENEMY_3D_SPREAD_VERTICAL_COUNT;
      const hMid = (hCount - 1) * 0.5;
      const vMid = (vCount - 1) * 0.5;
      for (let hi = 0; hi < hCount; hi++) {
        const hIndex = hi - hMid;
        const angle = baseAngle + hIndex * ENEMY_3D_SPREAD_HORIZONTAL_ANGLE;
        const curveSign = hIndex === 0 ? 0 : Math.sign(hIndex);
        for (let vi = 0; vi < vCount; vi++) {
          const vIndex = vi - vMid;
          spawnEnemyBullet(e, angle, ENEMY_3D_SPREAD_SPEED, ENEMY_3D_SPREAD_SIZE + Math.abs(vIndex) * 0.06, false, {
            startX,
            startY,
            startZ: startZ + vIndex * ENEMY_3D_SPREAD_VERTICAL_OFFSET,
            vz: vIndex * ENEMY_3D_SPREAD_VERTICAL_VELOCITY,
            life: ENEMY_3D_SPREAD_LIFE,
            tint: 'arc',
            damage: ENEMY_3D_SPREAD_DAMAGE,
            arc: true,
            curveSign,
            curveAmount: curveSign === 0 ? 0.32 : 0.82,
          });
        }
      }
    }

    function getDiagonalLaserScreenLine(direction) {
      const margin = 120;
      if (direction < 0) {
        return {
          x1: -margin,
          y1: 90,
          x2: WIDTH + margin,
          y2: HEIGHT - 110,
        };
      }
      return {
        x1: WIDTH + margin,
        y1: 90,
        x2: -margin,
        y2: HEIGHT - 110,
      };
    }

    function fireEnemyDiagonalLaserShot(e) {
      e.lastFireShotTick = enemyUpdateTick;
      e.attackPatternDirection = Math.random() < 0.5 ? -1 : 1;
      e.laserHitOnce = false;
    }

    function distancePointToLineSegment(px, py, x1, y1, x2, y2) {
      const dx = x2 - x1;
      const dy = y2 - y1;
      const lenSq = dx * dx + dy * dy || 1;
      const t = clamp(((px - x1) * dx + (py - y1) * dy) / lenSq, 0, 1);
      const lx = x1 + dx * t;
      const ly = y1 + dy * t;
      return Math.hypot(px - lx, py - ly);
    }

    function chooseEnemyAttackPattern(e) {
      // Laser overlay pattern is disabled for now; keep the function for later.
      const sequence = ['spiral_gatling', 'triple_wave', 'single', 'teleport_arc_burst', 'single', 'charged_3d_spread', 'spiral_gatling', 'single'];
      const pattern = sequence[e.attackPatternIndex % sequence.length];
      e.attackPatternIndex++;
      e.attackPattern = pattern;
      e.patternBurstCooldown = 0;
      e.attackPatternDirection = Math.random() < 0.5 ? -1 : 1;
      e.laserHitOnce = false;
      e.patternTimer = pattern === 'spiral_gatling'
        ? ENEMY_SPIRAL_GATLING_DURATION
        : pattern === 'teleport_arc_burst'
            ? 1
          : pattern === 'charged_3d_spread'
            ? 1
          : 1;
      return pattern;
    }

    function updateEnemyAttackPattern(e) {
      if (!e.attackPattern || e.patternTimer <= 0) return;

      if (e.attackPattern === 'single') {
        fireEnemySingleShot(e);
        e.patternTimer = 0;
        return;
      }

      if (e.attackPattern === 'triple_wave') {
        fireEnemyTripleWaveShot(e);
        e.patternTimer = 0;
        return;
      }

      if (e.attackPattern === 'spiral_gatling') {
        if (e.patternBurstCooldown <= 0) {
          fireEnemySpiralGatlingShot(e);
          e.patternBurstCooldown = ENEMY_SPIRAL_GATLING_INTERVAL;
        } else {
          e.patternBurstCooldown--;
        }
        e.patternTimer--;
        return;
      }

      if (e.attackPattern === 'diagonal_laser') {
        const total = ENEMY_DIAGONAL_LASER_TELL_TIME + ENEMY_DIAGONAL_LASER_FIRE_TIME;
        const elapsed = total - e.patternTimer;
        if (elapsed === 0) {
          fireEnemyDiagonalLaserShot(e);
        }
        if (
          elapsed >= ENEMY_DIAGONAL_LASER_TELL_TIME &&
          !e.laserHitOnce &&
          player.invTimer === 0
        ) {
          const playerScreen = project3D(player.x, player.y, getEyeZ() - CAMERA_EYE_HEIGHT * 0.35);
          if (playerScreen) {
            const line = getDiagonalLaserScreenLine(e.attackPatternDirection);
            const distToLaser = distancePointToLineSegment(playerScreen.x, playerScreen.y, line.x1, line.y1, line.x2, line.y2);
            if (distToLaser <= ENEMY_DIAGONAL_LASER_WIDTH + 18) {
              player.hp = Math.max(0, player.hp - ENEMY_DIAGONAL_LASER_DAMAGE);
              player.hitFlash = 22;
              player.invTimer = 42;
              e.laserHitOnce = true;
            }
          }
        }
        e.patternTimer--;
      }
    }

    function updateEnemyShots() {
      if (gamePaused || gameOver) return;
      for (let i = enemyBullets.length - 1; i >= 0; i--) {
        const b = enemyBullets[i];
        b.x += b.vx;
        b.y += b.vy;
        b.z += b.vz || 0;
        if (b.arc) {
          const progress = 1 - (b.life / (b.maxLife || 1));
          const arcOffset = Math.sin(progress * Math.PI) * b.curveAmount * b.curveSign;
          const deltaOffset = arcOffset - (b.arcPrevOffset || 0);
          b.x += b.wavePerpX * deltaOffset;
          b.y += b.wavePerpY * deltaOffset;
          b.arcPrevOffset = arcOffset;
        }
        if (b.wave) {
          const t = (b.maxLife || 90) - b.life;
          const sway = Math.sin(t * 0.28) * 0.02;
          b.x += b.wavePerpX * sway;
          b.y += b.wavePerpY * sway;
        }
        b.life--;
        if (b.life <= 0) { enemyBullets.splice(i, 1); continue; }
        if (player.invTimer > 0) continue;
        const hitR = 0.5 * (b.size || 1);
        if (Math.hypot(b.x - player.x, b.y - player.y) < hitR) {
          player.hp = Math.max(0, player.hp - (b.damage || 5));
          player.hitFlash = 20;
          player.invTimer = 90;
          const kAng = Math.atan2(player.y - b.y, player.x - b.x);
          player.knockX = Math.cos(kAng) * KNOCKBACK_SPD;
          player.knockY = Math.sin(kAng) * KNOCKBACK_SPD;
          enemyBullets.splice(i, 1);
        }
      }
    }

    function updatePlayerMissiles() {
      if (gamePaused || gameOver) return;
      for (let i = playerMissiles.length - 1; i >= 0; i--) {
        const m = playerMissiles[i];
        m.age = (m.age || 0) + 1;
        m.speed = Math.min(PLAYER_MISSILE_MAX_SPEED, m.speed + PLAYER_MISSILE_ACCEL);

        // Mild homing so the missile is visibly useful without feeling like a hard lock.
        const target = enemies.find(e => !e.dead && e.state !== 'dying');
        if (target) {
          const tx = target.x + target.w / 2;
          const ty = target.y + target.d / 2;
          const dx = tx - m.x;
          const dy = ty - m.y;
          const len = Math.hypot(dx, dy) || 1;
          m.dirX += (dx / len - m.dirX) * 0.08;
          m.dirY += (dy / len - m.dirY) * 0.08;
          const dirLen = Math.hypot(m.dirX, m.dirY) || 1;
          m.dirX /= dirLen;
          m.dirY /= dirLen;
        }

        m.vx = m.dirX * m.speed;
        m.vy = m.dirY * m.speed;
        m.vz = 0;
        m.x += m.vx;
        m.y += m.vy;
        m.z += m.vz;
        m.life--;

        let exploded = false;
        for (const e of enemies) {
          if (e.dead || e.state === 'dying') continue;
          const ex = e.x + e.w / 2;
          const ey = e.y + e.d / 2;
          const ez = e.z + e.h * 0.55;
          const dist2D = Math.hypot(m.x - ex, m.y - ey);
          const distZ = Math.abs(m.z - ez);
          if (dist2D <= 0.95 && distZ <= 1.0) {
            explodePlayerMissile(m);
            exploded = true;
            break;
          }
        }

        if (!exploded && (m.life <= 0 || !isInsideWorld2Bounds(m.x, m.y, 0.1))) {
          explodePlayerMissile(m);
          exploded = true;
        }

        if (exploded) {
          playerMissiles.splice(i, 1);
        }
      }

      for (let i = missileBursts.length - 1; i >= 0; i--) {
        missileBursts[i].timer--;
        if (missileBursts[i].timer <= 0) missileBursts.splice(i, 1);
      }
    }

    function castRayFrom(originX, originY, angle) {
      const sin = Math.sin(angle);
      const cos = Math.cos(angle);
      for (let depth = 0.03; depth < MAX_DEPTH; depth += 0.03) {
        const x = originX + cos * depth;
        const y = originY + sin * depth;
        const aimZ = getAimHeightAtDepth(depth);
        const object = getGridObjectAt(x, y);
        if (object && aimZ >= object.z && aimZ <= object.z + object.h) {
          return { depth, edge: 0.5, x, y, z: aimZ, hitType: 'object', object };
        }
        for (const e of enemies) {
          if (e.dead) continue;
          if (x >= e.x && x < e.x + e.w && y >= e.y && y < e.y + e.d &&
              aimZ >= e.z && aimZ <= e.z + e.h) {
            return { depth, edge: 0.5, x, y, z: aimZ, hitType: 'enemy', enemy: e, object: null };
          }
        }
        if (ACTIVE_WORLD === 'World1' && isWall(x, y)) {
          const localX = x - Math.floor(x);
          const localY = y - Math.floor(y);
          const edge = Math.min(localX, 1 - localX, localY, 1 - localY);
          return { depth, edge, x, y, z: aimZ, hitType: 'wall', object: null };
        }
        if (ACTIVE_WORLD === 'World2') {
          const floorZ = getBaseGroundHeightAt(x, y);
          if (aimZ <= floorZ + 0.02) {
            return { depth, edge: 0.5, x, y, z: floorZ, hitType: 'floor', object: null };
          }
        }
      }
      return {
        depth: MAX_DEPTH,
        edge: 0.5,
        x: originX + cos * MAX_DEPTH,
        y: originY + sin * MAX_DEPTH,
        z: getAimHeightAtDepth(MAX_DEPTH),
        hitType: 'none',
        object: null
      };
    }

    function castRay(angle) {
      return castRayFrom(player.x, player.y, angle);
    }

    function castWallRayFrom(originX, originY, angle) {
      if (ACTIVE_WORLD === 'World2') {
        return castRayFrom(originX, originY, angle);
      }
      const sin = Math.sin(angle);
      const cos = Math.cos(angle);
      for (let depth = 0.03; depth < MAX_DEPTH; depth += 0.03) {
        const x = originX + cos * depth;
        const y = originY + sin * depth;
        if (isWall(x, y)) {
          const localX = x - Math.floor(x);
          const localY = y - Math.floor(y);
          const edge = Math.min(localX, 1 - localX, localY, 1 - localY);
          return { depth, edge, x, y };
        }
      }
      return { depth: MAX_DEPTH, edge: 0.5, x: originX + cos * MAX_DEPTH, y: originY + sin * MAX_DEPTH };
    }

    function worldToCamera(x, y, z) {
      const dx = x - player.x;
      const dy = y - player.y;
      const sin = Math.sin(player.angle);
      const cos = Math.cos(player.angle);
      const camX = dx * sin - dy * cos;
      const camZ = dx * cos + dy * sin;
      // The player's base height is the foot/floor contact point.
      // Camera eye height stays above the feet for a standing first-person view.
      const camY = z - getEyeZ();
      const pitchSin = Math.sin(player.pitch);
      const pitchCos = Math.cos(player.pitch);
      return {
        x: camX,
        y: camY * pitchCos - camZ * pitchSin,
        z: camY * pitchSin + camZ * pitchCos,
      };
    }

    function project3D(x, y, z) {
      const cam = worldToCamera(x, y, z);
      if (cam.z <= 0.08) return null;
      const horizon = getSceneHorizon();
      return {
        x: WIDTH / 2 + (cam.x / cam.z) * FOCAL,
        y: horizon - (cam.y / cam.z) * FOCAL,
        z: cam.z
      };
    }

    function drawPoly(points, fill, stroke = null) {
      if (points.length < 3) return;
      ctx.beginPath();
      ctx.moveTo(points[0].x, points[0].y);
      for (let i = 1; i < points.length; i++) ctx.lineTo(points[i].x, points[i].y);
      ctx.closePath();
      ctx.fillStyle = fill;
      ctx.fill();
      if (stroke) {
        ctx.strokeStyle = stroke;
        ctx.lineWidth = 1;
        ctx.stroke();
      }
    }

    function drawBox3D(x, y, w, d, h, colors, faceDir = 1, locked = false, baseZ = 0) {
      const pts = {
        fbl: project3D(x, y + d, baseZ),
        fbr: project3D(x + w, y + d, baseZ),
        bbl: project3D(x, y, baseZ),
        bbr: project3D(x + w, y, baseZ),
        ftl: project3D(x, y + d, baseZ + h),
        ftr: project3D(x + w, y + d, baseZ + h),
        btl: project3D(x, y, baseZ + h),
        btr: project3D(x + w, y, baseZ + h),
      };
      const visible = Object.values(pts).filter(Boolean);
      if (visible.length < 4) return;
      const cx = x + w / 2;
      const cy = y + d / 2;
      const cam = worldToCamera(cx, cy, baseZ + h * 0.5);
      if (cam.z <= 0.12) return;

      const sideRight = faceDir >= 0;
      drawPoly([pts.btl, pts.btr, pts.ftr, pts.ftl].filter(Boolean), colors.top, colors.outline);
      if (sideRight) {
        drawPoly([pts.bbr, pts.btr, pts.ftr, pts.fbr].filter(Boolean), colors.side, colors.outline);
      } else {
        drawPoly([pts.bbl, pts.btl, pts.ftl, pts.fbl].filter(Boolean), colors.side, colors.outline);
      }
      drawPoly([pts.fbl, pts.fbr, pts.ftr, pts.ftl].filter(Boolean), colors.front, colors.outline);

      if (colors.face) {
        const face = project3D(cx + faceDir * 0.06, y + d + 0.01, baseZ + h * 0.58);
        const face2 = project3D(cx + faceDir * 0.06, y + d + 0.01, baseZ + h * 0.37);
        if (face && face2) {
          const scale = 70 / cam.z;
          ctx.fillStyle = colors.face;
          ctx.fillRect(face.x - scale * 0.34, face.y - scale * 0.1, scale * 0.2, scale * 0.08);
          ctx.fillRect(face.x + scale * 0.14, face.y - scale * 0.1, scale * 0.2, scale * 0.08);
          ctx.fillRect(face2.x - scale * 0.08, face2.y, scale * 0.16, scale * 0.05);
        }
      }

      if (locked) {
        const top = project3D(cx, cy, baseZ + h + 0.28);
        if (top) {
          ctx.strokeStyle = 'rgba(255,220,120,0.9)';
          ctx.lineWidth = 2;
          ctx.strokeRect(top.x - 32 / cam.z * 6, top.y - 18 / cam.z * 6, 64 / cam.z * 6, 70 / cam.z * 6);
        }
      }
    }

    function drawBackground() {
      const horizon = getSceneHorizon();
      const ceiling = ctx.createLinearGradient(0, 0, 0, horizon);
      ceiling.addColorStop(0, '#0c1828');
      ceiling.addColorStop(0.55, '#162440');
      ceiling.addColorStop(1, '#1e3254');
      ctx.fillStyle = ceiling;
      ctx.fillRect(0, 0, WIDTH, horizon);

      // Base floor fill (tiles drawn on top by drawFloor)
      ctx.fillStyle = '#0c1420';
      ctx.fillRect(0, horizon, WIDTH, HEIGHT - horizon);
    }

    function drawTexturedFloorTile(p0, p1, p2, p3, tx, ty, fog) {
      if (!floorTileImg.complete || floorTileImg.naturalWidth === 0) return false;

      const minX = Math.min(p0.x, p1.x, p2.x, p3.x);
      const maxX = Math.max(p0.x, p1.x, p2.x, p3.x);
      const minY = Math.min(p0.y, p1.y, p2.y, p3.y);
      const maxY = Math.max(p0.y, p1.y, p2.y, p3.y);

      const w = maxX - minX;
      const h = maxY - minY;

      if (w <= 1 || h <= 1) return false;

      ctx.save();

      // その床タイルの形で切り抜く
      ctx.beginPath();
      ctx.moveTo(p0.x, p0.y);
      ctx.lineTo(p1.x, p1.y);
      ctx.lineTo(p2.x, p2.y);
      ctx.lineTo(p3.x, p3.y);
      ctx.closePath();
      ctx.clip();

      // タイルごとに画像を描く
ctx.globalAlpha = 0.38;
ctx.drawImage(floorTileImg, minX, minY, w, h);

ctx.globalAlpha = 1.0;
ctx.fillStyle = `rgba(0, 8, 20, ${0.38 + fog * 0.18})`;
ctx.fillRect(minX, minY, w, h);

      ctx.restore();

      return true;
    }

    function drawFloor() {
      // v1.5 floor pass:
      // use the existing blue grass tile image as the main surface,
      // then add only a lightweight animated tint on top.
      // This is much cheaper than fully procedural per-tile wave coloring.
      const T = 0.5; // larger tiles = fewer projected quads
      const px = player.x, py = player.y;
      const txMin = Math.floor((px - 20) / T);
      const txMax = Math.ceil((px + 20) / T);
      const tyMin = Math.floor((py - 14) / T);
      const tyMax = Math.ceil((py + 14) / T);
      const floorCenterX = MAP_W * 0.5;
      const floorCenterY = MAP_H * 0.5;
      const t = performance.now() * 0.001;

      for (let tx = txMin; tx <= txMax; tx++) {
        for (let ty = tyMin; ty <= tyMax; ty++) {
          const wx = tx * T, wy = ty * T;
          if (wx < 0 || wy < 0 || wx + T > MAP_W || wy + T > MAP_H) continue;
          const cx = wx + T / 2, cy = wy + T / 2;
          const cam = worldToCamera(cx, cy, 0);
          if (cam.z <= 0.05) continue;

          const p0 = project3D(wx,     wy,     0.002);
          const p1 = project3D(wx + T, wy,     0.002);
          const p2 = project3D(wx + T, wy + T, 0.002);
          const p3 = project3D(wx,     wy + T, 0.002);
          if (!p0 || !p1 || !p2 || !p3) continue;
          if (Math.max(p0.y, p1.y, p2.y, p3.y) < 0) continue;

          const fog = clamp(1 - cam.z / 22, 0, 1);
          const dx = cx - floorCenterX;
          const dy = cy - floorCenterY;
          const dist = Math.hypot(dx, dy);
          const textured = drawTexturedFloorTile(p0, p1, p2, p3, tx, ty, 1 - fog);

          // Lightweight radial wave tint over the texture.
          const waveA = Math.sin(dist * 1.55 - t * 1.6);
          const waveB = Math.sin(dist * 2.8 - t * 0.72) * 0.18;
          let wave = 0.5 + (waveA + waveB) * 0.22;
          wave = Math.floor(wave * 4) / 4;
          const radialFade = clamp(1 - dist / Math.max(MAP_W, MAP_H), 0.35, 1);
          const mix = clamp(wave * radialFade * fog, 0, 1);

          ctx.beginPath();
          ctx.moveTo(p0.x, p0.y);
          ctx.lineTo(p1.x, p1.y);
          ctx.lineTo(p2.x, p2.y);
          ctx.lineTo(p3.x, p3.y);
          ctx.closePath();

          if (!textured) {
            ctx.fillStyle = `rgb(${10 + Math.floor(18 * mix)},${22 + Math.floor(65 * mix)},${42 + Math.floor(88 * mix)})`;
            ctx.fill();
          } else {
            ctx.fillStyle = `rgba(${14 + Math.floor(20 * mix)},${44 + Math.floor(90 * mix)},${78 + Math.floor(118 * mix)},${0.08 + mix * 0.16})`;
            ctx.fill();
          }
        }
      }
    }

    function drawXrayPlatforms() {
      if (visorMode !== "xray") return;

      for (const platform of XRAY_PLATFORMS) {
        drawXrayPlatform(platform);
      }

      // When the player is standing on an XRAY platform,
      // keep a simple visible footprint near the bottom of the screen.
      // This avoids the platform visually disappearing when it is too close to the camera.
      let standingPlatform = null;

      for (const platform of XRAY_PLATFORMS) {
        const margin = 0.35;

        const insideX =
          player.x >= platform.x - margin &&
          player.x <= platform.x + platform.w + margin;

        const insideY =
          player.y >= platform.y - margin &&
          player.y <= platform.y + platform.d + margin;

        if (!insideX || !insideY) continue;

        const topZ = platform.z + platform.h;

        if (Math.abs(player.z - topZ) <= 0.9) {
          standingPlatform = platform;
          break;
        }
      }

      if (!standingPlatform) return;

      ctx.save();

      const cx = WIDTH / 2;
      const cy = HEIGHT * 0.76;
      const w = WIDTH * 0.46;
      const h = HEIGHT * 0.16;

      ctx.shadowColor = "rgba(190, 250, 255, 0.95)";
      ctx.shadowBlur = 18;
      ctx.fillStyle = "rgba(200, 250, 255, 0.26)";
      ctx.strokeStyle = "rgba(240, 255, 255, 0.90)";
      ctx.lineWidth = 2;

      ctx.beginPath();
      ctx.moveTo(cx - w * 0.50, cy + h * 0.45);
      ctx.lineTo(cx + w * 0.50, cy + h * 0.45);
      ctx.lineTo(cx + w * 0.34, cy - h * 0.35);
      ctx.lineTo(cx - w * 0.34, cy - h * 0.35);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.restore();
    }
    function getXrayPlatformTopAt(x, y) {

      let topZ = null;

      for (const platform of XRAY_PLATFORMS) {
        const insideX = x >= platform.x && x <= platform.x + platform.w;
        const insideY = y >= platform.y && y <= platform.y + platform.d;

        if (!insideX || !insideY) continue;

        const platformTop = platform.z + platform.h;

        if (topZ === null || platformTop > topZ) {
          topZ = platformTop;
        }
      }

      return topZ;

      function getCurrentXrayPlatformUnderPlayer() {
        for (const platform of XRAY_PLATFORMS) {
          const margin = 0.25;

          const insideX =
            player.x >= platform.x - margin &&
            player.x <= platform.x + platform.w + margin;

          const insideY =
            player.y >= platform.y - margin &&
            player.y <= platform.y + platform.d + margin;

          if (!insideX || !insideY) continue;

          const topZ = platform.z + platform.h;

          // プレイヤーがPlatformの高さ付近にいる時だけ「乗っている」とみなす
          if (Math.abs(player.z - topZ) <= 0.9) {
            return platform;
          }
        }

        return null;
      }
    }

    function drawXrayPlatform(platform) {
      // 8 corners
      const x0 = platform.x;
      const x1 = platform.x + platform.w;
      const y0 = platform.y;
      const y1 = platform.y + platform.d;
      const z0 = platform.z;
      const z1 = platform.z + platform.h;

      const p000 = project3D(x0, y0, z0);
      const p100 = project3D(x1, y0, z0);
